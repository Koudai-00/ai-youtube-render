<!doctype html>
<!-- RIZIN.54 勝敗予想まとめ 1920x1080【ニュースまとめ・中立】 -->
<html>
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>/* ============================================================
   textfx.js — 動画用テキスト「アニメーション」登録ライブラリ（再利用）
   GSAP前提・seek安全（全て paused timeline tl に時刻 t で tween を積む）。
   使い方: TextFX.charRise(tl, el, t, {dur, stagger}); など。退場は TextFX.exit。
   HyperFramesルール順守: gsapのみ/同要素同プロパティ多重禁止/exitはオーバーレイのみ可。
   ============================================================ */
(function () {
  const g = () => window.gsap;

  // 文字を span.tfx-ch に分割（インラインブロック）。空白は保持。1回だけ実行。
  function splitChars(el) {
    if (el.__tfxSplit) return el.__tfxChars;
    const text = el.textContent;
    el.textContent = "";
    const chars = [];
    for (const ch of text) {
      const s = document.createElement("span");
      s.className = "tfx-ch";
      s.style.display = "inline-block";
      s.style.whiteSpace = "pre";
      s.textContent = ch;
      el.appendChild(s);
      if (ch !== " " && ch !== "　") chars.push(s);
    }
    el.__tfxSplit = true; el.__tfxChars = chars;
    return chars;
  }

  const TextFX = {
    // 文字が下からせり上がり（スタッガー）
    charRise(tl, el, t, o = {}) {
      const ch = splitChars(el); const tl2 = g();
      tl.fromTo(el, { opacity: 1 }, { opacity: 1, duration: 0.01 }, t);
      tl.fromTo(ch, { yPercent: 120, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "back.out(1.6)", stagger: o.stagger || 0.035 }, t);
    },
    // 文字がスケールでポップ
    charPop(tl, el, t, o = {}) {
      const ch = splitChars(el);
      tl.fromTo(ch, { scale: 0.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.45, ease: o.ease || "back.out(2)", stagger: o.stagger || 0.03 }, t);
    },
    // 左→右クリップワイプ表示
    wipe(tl, el, t, o = {}) {
      tl.fromTo(el, { clipPath: "inset(0 100% 0 0)", opacity: 1 },
        { clipPath: "inset(0 0% 0 0)", duration: o.dur || 0.8, ease: o.ease || "power4.out" }, t);
    },
    // 下からマスク表示（行が立ち上がる）
    riseMask(tl, el, t, o = {}) {
      tl.fromTo(el, { clipPath: "inset(110% 0 0 0)", yPercent: 18, opacity: 1 },
        { clipPath: "inset(0% 0 0 0)", yPercent: 0, duration: o.dur || 0.6, ease: o.ease || "power3.out" }, t);
    },
    // ふわっと上昇フェード
    fadeUp(tl, el, t, o = {}) {
      tl.fromTo(el, { y: o.y || 40, opacity: 0 },
        { y: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "power3.out" }, t);
    },
    // スケールポップ（要素全体）
    scalePop(tl, el, t, o = {}) {
      tl.fromTo(el, { scale: o.from || 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "back.out(1.7)" }, t);
    },
    // インパクトのあるスラム（大→等倍＋ブラー）
    slam(tl, el, t, o = {}) {
      tl.fromTo(el, { scale: o.from || 1.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.42, ease: o.ease || "power3.out" }, t);
      blurTween(tl, el, t, o.blur || 16, o.dur || 0.42);
    },
    // ブラーイン（焦点が合う）
    blurIn(tl, el, t, o = {}) {
      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: (o.dur || 0.5) * 0.8, ease: "power1.out" }, t);
      blurTween(tl, el, t, o.blur || 18, o.dur || 0.5);
    },
    // ライトスピード（斜めスライドイン）
    lightspeed(tl, el, t, o = {}) {
      tl.fromTo(el, { x: o.x || 140, skewX: -22, opacity: 0 },
        { x: 0, skewX: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "power3.out" }, t);
    },
    // 下線スイープ（.tfx-uline 等の幅0→width）
    underline(tl, el, t, width, o = {}) {
      tl.fromTo(el, { width: 0 }, { width: width, duration: o.dur || 0.5, ease: o.ease || "power2.out" }, t);
    },
    // ゴールド等のグラデにシャイン走らせ（要素は background-size:230% 100% 想定）
    shine(tl, el, t, o = {}) {
      tl.fromTo(el, { backgroundPositionX: "120%" }, { backgroundPositionX: "-20%", duration: o.dur || 1.0, ease: "power1.inOut" }, t);
    },
    // オーバーレイ退場（カード等のみ可。シーン遷移には使わない）
    exit(tl, el, t, o = {}) {
      tl.to(el, { opacity: 0, y: o.y || -12, duration: o.dur || 0.35, ease: "power1.in" }, t);
    },
  };

  // filterブラーをオブジェクトproxyでtween（seek時もonUpdateで反映）。完了でinline filterを消し、CSSクラスのfilterを復帰。
  function blurTween(tl, el, t, from, dur) {
    const p = { b: from };
    tl.to(p, {
      b: 0, duration: dur, ease: "power2.out",
      onUpdate() { el.style.filter = "blur(" + p.b.toFixed(2) + "px)"; },
      onComplete() { el.style.filter = ""; },
      onReverseComplete() { el.style.filter = "blur(" + from + "px)"; },
    }, t);
  }

  window.TextFX = TextFX;
})();
</script>
<style>
/* ============================================================
   textfx.css — 動画用テキスト「デザイン」クラス集（再利用ライブラリ）
   HyperFrames合成にinjectして使う。アニメーションは textfx.js (GSAP/seek安全)。

/* 【縁取りは“外向きのみ”＝drop-shadow積層】-webkit-text-stroke(中央寄せ=字を細らせる)は大型文字で使わない。
   下記の --tfx-edge / --tfx-edge-sm を filter で重ね、グリフを太いまま外側だけに縁を付ける。 */
:root {
  --tfx-edge: drop-shadow(3px 0 0 #0a0a0a) drop-shadow(-3px 0 0 #0a0a0a) drop-shadow(0 3px 0 #0a0a0a) drop-shadow(0 -3px 0 #0a0a0a)
              drop-shadow(2.1px 2.1px 0 #0a0a0a) drop-shadow(-2.1px -2.1px 0 #0a0a0a) drop-shadow(2.1px -2.1px 0 #0a0a0a) drop-shadow(-2.1px 2.1px 0 #0a0a0a)
              drop-shadow(0 6px 9px rgba(0,0,0,.55));
  --tfx-edge-sm: drop-shadow(1.6px 0 0 #0a0a0a) drop-shadow(-1.6px 0 0 #0a0a0a) drop-shadow(0 1.6px 0 #0a0a0a) drop-shadow(0 -1.6px 0 #0a0a0a)
              drop-shadow(0 2px 6px rgba(0,0,0,.85));
}

/* --- 文字そのもののデザイン（.tfx-* を文字要素に付与） --- */
.tfx-mincho { font-family:"Mincho",serif; font-weight:900; }
.tfx-heavy  { font-family:"JPHeavy","Noto Sans JP",sans-serif; font-weight:900; }

/* 外向きアウトライン（白） */
.tfx-outline { color:#fff; filter:var(--tfx-edge); }
.tfx-outline-thin { color:#fff; filter:var(--tfx-edge-sm); }

/* ゴールドグラデ文字（縁は外向きdrop-shadow） */
.tfx-gold { background:linear-gradient(180deg,#fff7c0 0%,#ffe060 34%,#e0a020 64%,#fff5b0 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:var(--tfx-edge); }

/* ソリッドゴールド（文字分割アニメ charRise/charPop 用＝background-clipを使わない） */
.tfx-gold-solid { color:#ffd84b; filter:var(--tfx-edge); }

/* 赤金グラデ（情熱系） */
.tfx-fire { background:linear-gradient(180deg,#fff2c0 0%,#ffb43c 38%,#ff5a2a 72%,#c81818 100%);

  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:var(--tfx-edge); }

/* --- “枠/帯”系コンテナ（テキストを包む要素に付与） --- */
/* 赤帯（上下ゴールドライン） */
.tfxc-band { display:inline-block; padding:.18em .9em; background:linear-gradient(180deg,#d4001c,#7a0010);
  border-top:4px solid #ffd54a; border-bottom:4px solid #ffd54a; box-shadow:0 10px 26px rgba(0,0,0,.55); }

.tfxc-double { display:inline-block; padding:.22em 1em; border:4px solid #ffd54a; position:relative; background:rgba(8,8,10,.55); }
.tfxc-double::before { content:""; position:absolute; inset:7px; border:2px solid rgba(255,213,74,.7); pointer-events:none; }
/* 左アクセントバー */
.tfxc-leftbar { display:inline-block; padding:.1em .5em .1em .85em; position:relative; }
.tfxc-leftbar::before { content:""; position:absolute; left:0; top:14%; bottom:14%; width:10px; border-radius:5px; background:linear-gradient(180deg,#ffd84b,#ff7a00); box-shadow:0 0 12px rgba(255,150,0,.6); }
/* リボン（折れ角） */
.tfxc-ribbon { display:inline-block; padding:.2em 1.3em; position:relative; background:linear-gradient(180deg,#d4001c,#9a0014); box-shadow:0 8px 20px rgba(0,0,0,.5); }
.tfxc-ribbon::before,.tfxc-ribbon::after { content:""; position:absolute; top:100%; border:12px solid transparent; }

.tfxc-bracket { display:inline-block; padding:.16em 1.1em; position:relative; }
.tfxc-bracket::before,.tfxc-bracket::after { content:""; position:absolute; top:0; bottom:0; width:24px; border:5px solid #ffd54a; }
.tfxc-bracket::before { left:0; border-right:none; }
.tfxc-bracket::after  { right:0; border-left:none; }
/* スクリム（可読性パネル） */
.tfxc-scrim { padding:.4em 1em; border-radius:12px; background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.84) 0%, rgba(0,0,0,.6) 60%, rgba(0,0,0,0) 92%); }

/* ラベル小見出し（カードのsub用：ゴールド＋下線バー） */
.tfx-kicker { font-family:"JPHeavy"; color:#ffe89a; letter-spacing:.16em; position:relative; display:inline-block; padding-bottom:.4em;
  filter:var(--tfx-edge-sm); }
.tfx-kicker::after { content:""; position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:88px; height:4px; border-radius:2px; background:linear-gradient(90deg,#ffd84b,#ff7a00); box-shadow:0 0 10px rgba(255,150,0,.6); }

/* アンダースイープ用の下線要素 */
.tfx-uline { height:9px; width:0; margin:.18em auto 0; background:linear-gradient(90deg,transparent,#ffd84b 16%,#ff7a00 84%,transparent); }

ー戦みたいに触れさせずKOしたらもう昇天", "likes": "758", "anon": true, "pos": "left", "start": 308.72, "end": 321.99}, {"anchor": "ファンの応援は秋元寄りが目立ちますが", "author": "格闘技ファン", "handle": "@rizin_love", "verified": false, "initial": "K", "color": "#c0417a", "text": "クレベル秋元って秋元有利って言われてんのか。俺、全然クレベル勝つと思う", "likes": "420", "anon": true, "pos": "right", "start": 308.72, "end": 321.99}, {"anchor": "秋元を組める距離に入れさせないか", "author": "格闘技ファン", "handle": "@yosou_daily", "verified": false, "initial": "S", "color": "#4d8a5a", "text": "未だに悩んでる、まじでどっちもある。触らせない展開なら秋元、組んだらクレベル。一発は秋元…", "likes": "—", "anon": true, "pos": "center", "start": 308.72, "end": 321.99}], "tally": [{"start": 84.29, "end": 93.38}], "srcs": [{"start": 0.0, "end": 12.469, "text": "映像: Pexels"}, {"start": 12.469, "end": 20.411, "text": "画像: RIZIN FF公式"}, {"start": 20.411, "end": 27.704, "text": "出典: YouTube「青木真也」"}, {"start": 27.704, "end": 36.9, "text": "画像: RIZIN FF公式"}, {"start": 36.9, "end": 41.673, "text": "出典: YouTube「おぎちゃんねる」"}, {"start": 41.673, "end": 45.762, "text": "画像: RIZIN FF公式"}, {"start": 45.762, "end": 56.862, "text": "試合映像: RIZIN"}, {"start": 56.862, "end": 68.938, "text": "画像: RIZIN FF公式"}, {"start": 68.938, "end": 75.766, "text": "試合映像: RIZIN"}, {"start": 75.766, "end": 83.987, "text": "出典: YouTube「堀口恭司」"}, {"start": 83.987, "end": 95.912, "text": "映像: Pexels"}, {"start": 95.912, "end": 109.567, "text": "出典: YouTube「青木真也」"}, {"start": 109.567, "end": 118.903, "text": "出典: YouTube「ストロング金子/ストチャンネル」"}, {"start": 118.903, "end": 130.189, "text": "出典: YouTube「斎藤裕」"}, {"start": 130.189, "end": 141.847, "text": "出典: YouTube「ジョビンチャンネル(川尻達也)」"}, {"start": 141.847, "end": 149.232, "text": "出典: YouTube「ジョビンチャンネル」"}, {"start": 149.232, "end": 158.475, "text": "出典: YouTube「伊澤星花」"}, {"start": 158.475, "end": 175.242, "text": "画像: RIZIN FF公式"}, {"start": 175.242, "end": 187.504, "text": "出典: YouTube「kinchanTV(金原正徳)」"}, {"start": 187.504, "end": 199.487, "text": "出典: YouTube「石渡伸太郎」"}, {"start": 199.487, "end": 210.262, "text": "出典: YouTube「ジョビンチャンネル(佐伯繁)」"}, {"start": 210.262, "end": 222.187, "text": "出典: YouTube「高木凌」"}, {"start": 222.187, "end": 225.254, "text": "試合映像: RIZIN"}, {"start": 225.254, "end": 236.029, "text": "出典: YouTube「おぎちゃんねる(扇久保博正)」"}, {"start": 236.029, "end": 246.619, "text": "出典: YouTube「松嶋こよみ」"}, {"start": 246.619, "end": 255.402, "text": "出典: YouTube「元谷友貴」"}, {"start": 255.402, "end": 262.588, "text": "試合映像: RIZIN"}, {"start": 262.588, "end": 283.105, "text": "出典: YouTube「U-NEXT格闘技公式」"}, {"start": 283.105, "end": 292.488, "text": "画像: RIZIN FF公式"}, {"start": 292.488, "end": 297.087, "text": "出典: YouTube「秋元強真」"}, {"start": 297.087, "end": 324.617, "text": "映像: Pexels"}, {"start": 324.617, "end": 329.587, "text": "出典: YouTube「おぎちゃんねる」"}, {"start": 329.587, "end": 360.267, "text": "画像: RIZIN FF公式"}, {"start": 360.267, "end": 367.256, "text": "出典: YouTube「斎藤裕」"}, {"start": 367.256, "end": 427.769, "text": "画像: RIZIN FF公式"}, {"start": 427.769, "end": 439.798, "text": "出典: YouTube「石渡伸太郎」"}, {"start": 439.798, "end": 450.759, "text": "画像: RIZIN FF公式"}, {"start": 450.759, "end": 469.169, "text": "出典: YouTube「おぎちゃんねる(扇久保博正)」"}, {"start": 469.169, "end": 473.675, "text": "画像: RIZIN FF公式"}, {"start": 473.675, "end": 480.41, "text": "試合映像: RIZIN"}, {"start": 480.41, "end": 487.146, "text": "映像: Pexels"}, {"start": 487.146, "end": 492.952, "text": "画像: RIZIN FF公式"}, {"start": 492.952, "end": 502.468, "text": "映像: Pexels"}], "caps": [{"s": 0.3, "e": 6.93, "lines": ["今回は、8月11日にトヨタアリーナ東京で", "開催される、RIZIN.54について、格闘家や"]}, {"s": 6.93, "e": 12.42, "lines": ["専門家がどんな勝敗予想をしているのかを、まと", "めてご紹介します。"]}, {"s": 12.47, "e": 19.55, "lines": ["注目のメインイベントは、元RIZINフェザー級王者ク", "レベル・コイケと、20歳の新星、秋元強真の"]}, {"s": 19.55, "e": 20.36, "lines": ["一戦です。"]}, {"s": 20.41, "e": 27.65, "lines": ["青木真也さんや川尻達也さんをはじめ、YouTubeで", "予想を語った18人の声を集計しました。"]}, {"s": 27.7, "e": 34.41, "lines": ["後半では、セミファイナルの佐藤将光対パッチー・", "ミックスや、平本丈対ジョリーなど、その他の"]}, {"s": 34.41, "e": 36.85, "lines": ["注目カードの予想も見ていきます。"]}, {"s": 36.9, "e": 39.24, "lines": ["それでは、さっそく見ていきましょう。"]}, {"s": 41.67, "e": 45.71, "lines": ["まずはメインイベント、クレベル・コイケ対秋元強", "真です。"]}, {"s": 45.76, "e": 53.19, "lines": ["クレベル・コイケは37歳。柔術を武器に、", "朝倉未来選手を一本で破るなど、数々の強豪を"]}, {"s": 53.19, "e": 56.81, "lines": ["下してきた、元RIZINフェザー級王者です。"]}, {"s": 56.86, "e": 64.39, "lines": ["対する秋元強真は、まだ20歳。現在5連勝中で、", "前戦ではあのパッチー・ミックスをKOしました。"]}, {"s": 64.39, "e": 68.89, "lines": ["今大会が、10試合目でのメインイベント抜擢と", "なります。"]}, {"s": 68.94, "e": 75.72, "lines": ["打撃と若さの秋元か、それとも寝技と経験の", "クレベルか。予想は大きく割れました。"]}, {"s": 75.77, "e": 82.19, "lines": ["元ベラトール世界王者の堀口恭司さんも、若手が", "ベルトを獲るチャンスの、楽しみな一戦だとこの"]}, {"s": 82.19, "e": 83.94, "lines": ["試合に注目していました。"]}, {"s": 83.99, "e": 92.04, "lines": ["集計の結果は、秋元が12人、クレベルが5人、", "五分が1人。まずは、秋元有利と見る声か"]}, {"s": 92.04, "e": 93.48, "lines": ["ら紹介します。"]}, {"s": 95.91, "e": 102.63, "lines": ["青木真也さんは、秋元の1ラウンド後半か", "ら2ラウンドでのKO勝ちを予想。クレベルが"]}, {"s": 102.63, "e": 109.52, "lines": ["組める距離にそもそも入れない、活路は一撃の", "関節技しかない、と圧倒を見込みます。"]}, {"s": 109.57, "e": 116.14, "lines": ["ストラッサー起一さんも、忖度なしで秋元。", "1ラウンドで組みを切って打撃、2ラウンドで"]}, {"s": 116.14, "e": 118.85, "lines": ["倒す、と2ラウンドKOを挙げました。"]}, {"s": 118.9, "e": 126.14, "lines": ["斎藤裕さんは、戦前の予想はやはり秋元有利の", "声が多い、と分析。ただし、ベストの"]}, {"s": 126.14, "e": 130.14, "lines": ["クレベルなら一本もある、と含みも残します。"]}, {"s": 130.19, "e": 137.44, "lines": ["川尻達也さんは、みんなが思うほど差は", "大きくない、若干秋元くらいだ、と僅差の秋元。"]}, {"s": 137.44, "e": 141.8, "lines": ["クレベルの数少ない勝ち筋は足関節だと", "指摘します。"]}, {"s": 141.85, "e": 148.11, "lines": ["ジョビンさんも秋元。ノリに乗っていて、体重も", "増やし、メンタル的にも充実している、と"]}, {"s": 148.11, "e": 149.18, "lines": ["評価しました。"]}, {"s": 149.23, "e": 155.86, "lines": ["女子スーパーアトム級王者の伊澤星花さんは、", "パッチー・ミックス戦と同じく触られないだろう、"]}, {"s": 155.86, "e": 158.42, "lines": ["秋元は速すぎる、と秋元を推します。"]}, {"s": 158.47, "e": 166.97, "lines": ["征矢貴さんも、秋元のKO勝ち。現在進行形で、", "どんどん強くなっている、と成長を高く買います。"]}, {"s": 167.02, "e": 174.2, "lines": ["火の鳥さんは、秋元がタックルを切ってボディを", "削り、左ストレートで1ラウンドKO、と具体的に"]}, {"s": 174.2, "e": 175.19, "lines": ["読みました。"]}, {"s": 175.24, "e": 181.27, "lines": ["金原正徳さんは、U-NEXTの公式予想番組で秋元の", "3ラウンドTKOを予想。クレベルが"]}, {"s": 181.27, "e": 187.45, "lines": ["触れられなければ、パッチー・ミックス戦の", "ように削られてしまう、と見ています。"]}, {"s": 187.5, "e": 194.74, "lines": ["石渡伸太郎さんは、秋元を知れば知るほど怪物だと", "確信、パッチー・ミックス戦の"]}, {"s": 194.74, "e": 199.44, "lines": ["ような一方的な展開になる、と圧倒的に秋元を", "予想。"]}, {"s": 199.49, "e": 206.76, "lines": ["DEEP代表の佐伯繁さんも、距離感が", "良すぎてクレベルはそもそも組めない、結構差が"]}, {"s": 206.76, "e": 210.21, "lines": ["あって秋元有利、と秋元の流れを予想。"]}, {"s": 210.26, "e": 216.37, "lines": ["そしてRIZINフェザー級の高木凌さんも、", "クレベルは組みつけない、パッチー・ミックス戦の"]}, {"s": 216.37, "e": 219.76, "lines": ["ような展開になる、と秋元の勝ちを予想しました。"]}, {"s": 222.19, "e": 225.2, "lines": ["一方で、クレベルを推したのが5人です。"]}, {"s": 225.25, "e": 232.51, "lines": ["扇久保博正さんは、クレベルがラストチャンスと", "死に物狂いで組みにいく、要所と離れ際の打撃で"]}, {"s": 232.51, "e": 235.98, "lines": ["意地を見せて判定勝ち、と接戦を予想します。"]}, {"s": 236.03, "e": 242.83, "lines": ["松嶋こよみさんは、クレベルの一本勝ち。秋元の", "打撃は速いけれど、踏み込んだところを"]}, {"s": 242.83, "e": 246.57, "lines": ["捕まえられて、下から三角絞め、と読みました。"]}, {"s": 246.62, "e": 252.42, "lines": ["そして、過去に秋元から勝利を", "挙げている元谷友貴さん。クレベルは決め力が"]}, {"s": 252.42, "e": 258.39, "lines": ["トップクラスで、尻上がりに調子を上げる、", "最後まで分からない選手。いい形を"]}, {"s": 258.39, "e": 262.54, "lines": ["作らせたら本当に危険だ、とクレベル寄りの", "見解です。"]}, {"s": 262.59, "e": 268.37, "lines": ["柔術家のホベルト・サトシ・ソウザさんは、", "1ラウンドは秋元の打撃が最も危険だけれど、"]}, {"s": 268.37, "e": 274.08, "lines": ["2ラウンドからはクレベルの投げと寝技に", "チャンスがある、とクレベルの2ラウンド一本を"]}, {"s": 274.08, "e": 274.94, "lines": ["予想します。"]}, {"s": 274.99, "e": 280.68, "lines": ["そして、クレベルに打撃を指導する鈴木博昭さんも", "、クレベルを支持しました。"]}, {"s": 283.11, "e": 289.84, "lines": ["五分と見たのは1人。太田忍さんは、どちらが", "勝ってもおかしくない、決着はフィニッシュに"]}, {"s": 289.84, "e": 292.44, "lines": ["なるだろう、と明言を避けました。"]}, {"s": 292.49, "e": 297.04, "lines": ["では、当の秋元強真本人は、どう語っているので", "しょうか。"]}, {"s": 297.09, "e": 303.79, "lines": ["本人は、練習で触られることがほとんどない、", "クレベルの崩し方は全部読めている、と自信を"]}, {"s": 303.79, "e": 308.42, "lines": ["見せます。あとは丁寧に頑張るだけ、と", "落ち着いた様子でした。"]}, {"s": 308.47, "e": 315.41, "lines": ["ファンの応援は秋元寄りが目立ちますが、予想は", "、秋元のKOと、クレベルの一本や判定で"]}, {"s": 315.41, "e": 322.19, "lines": ["真っ二つ。秋元を組める距離に入れさせないか、", "それが最大の分岐点になりそうです。"]}, {"s": 324.62, "e": 329.54, "lines": ["ここからは、その他の注目カードの予想を、まと", "めて見ていきましょう。"]}, {"s": 329.59, "e": 336.49, "lines": ["セミファイナルは、佐藤将光対パッチー・ミックス", "。多くの予想者がミックス優勢と見ています。"]}, {"s": 336.49, "e": 342.77, "lines": ["青木真也さんはミックスがザバっと勝つと予想。", "一方、斎藤裕さんは五分と評しました。"]}, {"s": 342.82, "e": 349.12, "lines": ["鍵は、ミックスのコンディションと計量です。", "計量オーバーがあれば佐藤将光の判定勝ちも"]}, {"s": 349.12, "e": 351.58, "lines": ["ある、という声も上がっています。"]}, {"s": 351.73, "e": 359.21, "lines": ["平本丈対ジョリーは、1ラウンド勝負という見方が", "支配的です。斎藤裕さんと石渡伸太郎さんは、"]}, {"s": 359.21, "e": 366.18, "lines": ["打たれ強い平本丈が打撃で優勢と予想。一方、", "秋元強真さんはジョリーの2ラウンド一本を"]}, {"s": 366.18, "e": 367.21, "lines": ["推しました。"]}, {"s": 367.26, "e": 374.65, "lines": ["公式番組でも、伊澤星花さんは平本の判定、", "征矢貴さんは平本のKO、火の鳥さんはジョリーの"]}, {"s": 374.65, "e": 378.35, "lines": ["一本と、パネルの中でも意見が割れています。"]}, {"s": 378.4, "e": 385.26, "lines": ["後藤丈治対アジズベク・テミロフは、真っ二つ。", "扇久保選手は、後藤の前蹴りや膝の距離感を"]}, {"s": 385.26, "e": 391.54, "lines": ["評価して判定。松嶋こよみさんは、テミロフの", "爆発力で1ラウンド決着と読みました。"]}, {"s": 391.59, "e": 398.06, "lines": ["伊藤裕樹対アリベク・ガジャマトフは、伊藤が", "組みを切って打撃で圧倒できるかが鍵。"]}, {"s": 398.06, "e": 405.19, "lines": ["金原正徳さんと斎藤裕さんは伊藤寄り。一方、", "青木真也さんと征矢貴さんは、ボクシング能力で"]}, {"s": 405.19, "e": 409.01, "lines": ["上回るガジャマトフの判定勝ちを予想しています。"]}, {"s": 409.06, "e": 417.31, "lines": ["組み技同士の対決、摩嶋一整対武田光司は、", "拮抗カード。石渡伸太郎さんは摩嶋の肩固めでの"]}, {"s": 417.31, "e": 425.17, "lines": ["一本、松嶋こよみさんと青木真也さんは武田の", "勝利。斎藤裕さんは、短期決戦なら摩嶋、"]}, {"s": 425.17, "e": 427.72, "lines": ["長引けば武田と分析します。"]}, {"s": 427.77, "e": 433.93, "lines": ["水野新太対リー・カイウェンは、ほぼ全員が", "水野。金原正徳さんは競り勝ち、"]}, {"s": 433.93, "e": 439.75, "lines": ["石渡伸太郎さんはKOと、水野の細か", "く多彩な打撃を高く評価しています。"]}, {"s": 439.8, "e": 447.13, "lines": ["上田幹雄対エドポロ・キングは、上田の蹴りと", "スピードが優勢という声が多数。扇久保選手は、"]}, {"s": 447.13, "e": 450.71, "lines": ["上田の左上段回し蹴りでのKOを予想しました。"]}, {"s": 450.76, "e": 459.38, "lines": ["直樹対細川一颯は、総合力の直樹か、一発を", "持つ細川か。石渡伸太郎さんは直樹の1ラウンド、"]}, {"s": 459.38, "e": 467.6, "lines": ["扇久保選手は直樹のバックからの一本。一方、", "秋元強真さんは細川の1ラウンドKOを推し、"]}, {"s": 467.6, "e": 469.02, "lines": ["割れています。"]}, {"s": 469.17, "e": 473.62, "lines": ["以上、RIZIN.54の勝敗予想を、まと", "めてお届けしました。"]}, {"s": 473.68, "e": 480.36, "lines": ["メインは秋元有利の声が優勢ながら、クレベルの", "逆転を推す実力者も、少なくありません。"]}, {"s": 480.41, "e": 485.82, "lines": ["皆さんは、どの試合の、どちらが勝つと", "思いますか。ぜひコメントで予想を"]}, {"s": 485.82, "e": 487.1, "lines": ["教えてください。"]}, {"s": 487.15, "e": 492.9, "lines": ["RIZIN.54は、8月11日、トヨタアリーナ東京で", "開催されます。"]}, {"s": 492.95, "e": 497.63, "lines": ["この動画が参考になったら、高評価と", "チャンネル登録をお願いします。"]}, {"s": 497.63, "e": 502.17, "lines": ["格闘ニュースラボでした。最後までご視聴ありが", "とうございました。"]}], "chapters": [{"sec": "s1_card", "start": 39.393, "end": 41.393, "title": "メインイベント", "sub": "クレベル・コイケ vs 秋元強真"}, {"sec": "s2_akimoto", "start": 93.632, "end": 95.632, "title": "秋元有利論", "sub": "12人が秋元を予想"}, {"sec": "s3_kleber", "start": 219.907, "end": 221.907, "title": "クレベル逆転論", "sub": "5人がクレベルを予想"}, {"sec": "s4_even", "start": 280.825, "end": 282.825, "title": "割れる予想", "sub": "五分、そして本人は"}, {"sec": "s5_semi", "start": 322.337, "end": 324.337, "title": "後半の注目カード", "sub": "セミファイナルほか"}], "channel": "格闘ニュースラボ"};
  const ovLayer = document.getElementById('ovLayer');

  DATA.bg.forEach((s) => {
    const el = document.getElementById(s.id);
    const kb = el.querySelector('.bgmain') || el.querySelector('.bgv');
    const dur = Math.max(0.6, s.end - s.start);
    // Ken Burns: 窓分割でも連続(ビルダーがセグメント進行度で from/to を補間済み)。ease:none で線形＝ピース境界で速度連続。
    const kf = s.kb_from || {scale:1.02,x:0,y:0}, kt = s.kb_to || {scale:1.08,x:0,y:0};
    if (kb) tl.fromTo(kb,
      {scale:kf.scale, xPercent:kf.x, yPercent:kf.y},
      {scale:kt.scale, xPercent:kt.x, yPercent:kt.y, duration:dur, ease:'none'}, s.start);

      ? "<div class='xavi' style='background:"+(c.color||'#3b7fd4')+"'>"+(c.initial||'?')+"</div>"
      : "<img class='xav' src='assets/img/"+c.avatar+"'>";
    el.innerHTML = "<div class='xhead'>"+av+"<div><div class='xname'>"+c.author+(c.verified?VER:"")+"</div><div class='xhandle'>"+c.handle+"</div></div></div>"
      + "<div class='xtext'>"+c.text+"</div><div class='xmeta'>♡ <b>"+c.likes+"</b>  ・ X(旧Twitter)より</div>";
    xLayer.appendChild(el);
    const tf = el.style.transform || '';
    if (c.cont) tl.set(el,{opacity:1},c.start);
    else tl.fromTo(el,{opacity:0,y:16},{opacity:1,y:0,duration:.4,ease:'power3.out'}, c.start);
    if (!c.cont_end) tl.to(el,{opacity:0,duration:.3,ease:'power1.in'}, c.end-.3);
  });

  // 集計カード
  const tallyLayer = document.getElementById('tallyLayer');
  DATA.tally.forEach((t) => {
    const el = document.createElement('div'); el.className='tally';
    el.innerHTML = "<div class='thead'>予想者18人の内訳</div><div class='trow'>"
      + "<div class='tcell ak'><div class='tlabel'>秋元</div><div class='tnum'>12<em>人</em></div></div>"
      + "<div class='tcell kl'><div class='tlabel'>クレベル</div><div class='tnum'>5<em>人</em></div></div>"
      + "<div class='tcell ev'><div class='tlabel'>五分</div><div class='tnum'>1<em>人</em></div></div></div>";
    tallyLayer.appendChild(el);
    const cells = el.querySelectorAll('.tcell');
    if (t.cont) { tl.set(el,{opacity:1},t.start); tl.set(cells,{opacity:1,y:0},t.start); }
    else {
      tl.fromTo(el,{opacity:0},{opacity:1,duration:.3}, t.start);
      tl.fromTo(cells,{opacity:0,y:26},{opacity:1,y:0,duration:.45,stagger:.12,ease:'back.out(1.3)'}, t.start+.1);
    }
    if (!t.cont_end) tl.to(el,{opacity:0,duration:.3,ease:'power1.in'}, t.end-.3);
  });

  const capLayer = document.getElementById('capLayer');
  (DATA.caps||[]).forEach((c) => {
    const el = document.createElement('div'); el.className='cap';
    el.innerHTML = c.lines.map((l)=>"<div class='cl'>"+l+"</div>").join('');
    capLayer.appendChild(el);
    if (c.cont) tl.set(el,{opacity:1,y:0},c.s);
    else tl.fromTo(el,{opacity:0,y:8},{opacity:1,y:0,duration:.14,ease:'power1.out'}, c.s);
    if (!c.cont_end) tl.to(el,{opacity:0,duration:.1,ease:'power1.in'}, c.e);
  });

  const chapLayer = document.getElementById('chapLayer');
  (DATA.chapters||[]).forEach((ch)=>{
    const el=document.createElement('div'); el.className='chap';
    el.innerHTML="<div class='cfull'></div><div class='cinner'><div class='csub2'>"+ch.sub+"</div><div class='ctitle'>"+ch.title+"</div><div class='cline'></div></div>";
    chapLayer.appendChild(el);
    const inner=el.querySelector('.cinner'), ttl=el.querySelector('.ctitle'), line=el.querySelector('.cline');
    if (ch.cont) { tl.set(el,{opacity:1},0); tl.set(inner,{scale:1.0},0); tl.set(ttl,{letterSpacing:'0.04em',opacity:1},0); tl.set(line,{width:560},0); }
    else {
      tl.fromTo(el,{opacity:0},{opacity:1,duration:.2,ease:'power1.out'}, ch.start);
      tl.fromTo(inner,{scale:1.1},{scale:1.0,duration:.55,ease:'power3.out'}, ch.start);
      tl.fromTo(ttl,{letterSpacing:'0.2em',opacity:0},{letterSpacing:'0.04em',opacity:1,duration:.5,ease:'power2.out'}, ch.start+0.04);
      tl.fromTo(line,{width:0},{width:560,duration:.55,ease:'power2.out'}, ch.start+0.18);
    }
    if (!ch.cont_end) tl.to(el,{opacity:0,duration:.3,ease:'power1.in'}, ch.end-0.3);
  });

  window.__timelines = window.__timelines || {};
  window.__timelines['rizin54-yosou'] = tl;
</script>
</body>
</html>
