<!doctype html>
<!-- RIZIN.54 勝敗予想まとめ 1920x1080【ニュースまとめ・中立】 -->
<html>
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>/* ============================================================
   textfx.js — 動画用テキスト「アニメーション」登録ライブラリ（再利用）
   GSAP前提・seek安全（全て paused timeline tl に時刻 t で tween を積む）。
   使い方: TextFX.charRise(tl, el, t, {dur, stagger}); など。退場は TextFX.exit。
   HyperFramesルール順守: gsapのみ/同要素同プロパティ多重禁止/exitはオーバーレイのみ可。
   ============================================================ */
(function () {
  const g = () => window.gsap;

  // 文字を span.tfx-ch に分割（インラインブロック）。空白は保持。1回だけ実行。
  function splitChars(el) {
    if (el.__tfxSplit) return el.__tfxChars;
    const text = el.textContent;
    el.textContent = "";
    const chars = [];
    for (const ch of text) {
      const s = document.createElement("span");
      s.className = "tfx-ch";
      s.style.display = "inline-block";
      s.style.whiteSpace = "pre";
      s.textContent = ch;
      el.appendChild(s);
      if (ch !== " " && ch !== "　") chars.push(s);
    }
    el.__tfxSplit = true; el.__tfxChars = chars;
    return chars;
  }

  const TextFX = {
    // 文字が下からせり上がり（スタッガー）
    charRise(tl, el, t, o = {}) {
      const ch = splitChars(el); const tl2 = g();
      tl.fromTo(el, { opacity: 1 }, { opacity: 1, duration: 0.01 }, t);
      tl.fromTo(ch, { yPercent: 120, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "back.out(1.6)", stagger: o.stagger || 0.035 }, t);
    },
    // 文字がスケールでポップ
    charPop(tl, el, t, o = {}) {
      const ch = splitChars(el);
      tl.fromTo(ch, { scale: 0.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.45, ease: o.ease || "back.out(2)", stagger: o.stagger || 0.03 }, t);
    },
    // 左→右クリップワイプ表示
    wipe(tl, el, t, o = {}) {
      tl.fromTo(el, { clipPath: "inset(0 100% 0 0)", opacity: 1 },
        { clipPath: "inset(0 0% 0 0)", duration: o.dur || 0.8, ease: o.ease || "power4.out" }, t);
    },
    // 下からマスク表示（行が立ち上がる）
    riseMask(tl, el, t, o = {}) {
      tl.fromTo(el, { clipPath: "inset(110% 0 0 0)", yPercent: 18, opacity: 1 },
        { clipPath: "inset(0% 0 0 0)", yPercent: 0, duration: o.dur || 0.6, ease: o.ease || "power3.out" }, t);
    },
    // ふわっと上昇フェード
    fadeUp(tl, el, t, o = {}) {
      tl.fromTo(el, { y: o.y || 40, opacity: 0 },
        { y: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "power3.out" }, t);
    },
    // スケールポップ（要素全体）
    scalePop(tl, el, t, o = {}) {
      tl.fromTo(el, { scale: o.from || 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "back.out(1.7)" }, t);
    },
    // インパクトのあるスラム（大→等倍＋ブラー）
    slam(tl, el, t, o = {}) {
      tl.fromTo(el, { scale: o.from || 1.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.42, ease: o.ease || "power3.out" }, t);
      blurTween(tl, el, t, o.blur || 16, o.dur || 0.42);
    },
    // ブラーイン（焦点が合う）
    blurIn(tl, el, t, o = {}) {
      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: (o.dur || 0.5) * 0.8, ease: "power1.out" }, t);
      blurTween(tl, el, t, o.blur || 18, o.dur || 0.5);
    },
    // ライトスピード（斜めスライドイン）
    lightspeed(tl, el, t, o = {}) {
      tl.fromTo(el, { x: o.x || 140, skewX: -22, opacity: 0 },
        { x: 0, skewX: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "power3.out" }, t);
    },
    // 下線スイープ（.tfx-uline 等の幅0→width）
    underline(tl, el, t, width, o = {}) {
      tl.fromTo(el, { width: 0 }, { width: width, duration: o.dur || 0.5, ease: o.ease || "power2.out" }, t);
    },
    // ゴールド等のグラデにシャイン走らせ（要素は background-size:230% 100% 想定）
    shine(tl, el, t, o = {}) {
      tl.fromTo(el, { backgroundPositionX: "120%" }, { backgroundPositionX: "-20%", duration: o.dur || 1.0, ease: "power1.inOut" }, t);
    },
    // オーバーレイ退場（カード等のみ可。シーン遷移には使わない）
    exit(tl, el, t, o = {}) {
      tl.to(el, { opacity: 0, y: o.y || -12, duration: o.dur || 0.35, ease: "power1.in" }, t);
    },
  };

  // filterブラーをオブジェクトproxyでtween（seek時もonUpdateで反映）。完了でinline filterを消し、CSSクラスのfilterを復帰。
  function blurTween(tl, el, t, from, dur) {
    const p = { b: from };
    tl.to(p, {
      b: 0, duration: dur, ease: "power2.out",
      onUpdate() { el.style.filter = "blur(" + p.b.toFixed(2) + "px)"; },
      onComplete() { el.style.filter = ""; },
      onReverseComplete() { el.style.filter = "blur(" + from + "px)"; },
    }, t);
  }

  window.TextFX = TextFX;
})();
</script>

/* ============================================================
   textfx.css — 動画用テキスト「デザイン」クラス集（再利用ライブラリ）
   HyperFrames合成にinjectして使う。アニメーションは textfx.js (GSAP/seek安全)。

/* 【縁取りは“外向きのみ”＝drop-shadow積層】-webkit-text-stroke(中央寄せ=字を細らせる)は大型文字で使わない。
   下記の --tfx-edge / --tfx-edge-sm を filter で重ね、グリフを太いまま外側だけに縁を付ける。 */
:root {
  --tfx-edge: drop-shadow(3px 0 0 #0a0a0a) drop-shadow(-3px 0 0 #0a0a0a) drop-shadow(0 3px 0 #0a0a0a) drop-shadow(0 -3px 0 #0a0a0a)
              drop-shadow(2.1px 2.1px 0 #0a0a0a) drop-shadow(-2.1px -2.1px 0 #0a0a0a) drop-shadow(2.1px -2.1px 0 #0a0a0a) drop-shadow(-2.1px 2.1px 0 #0a0a0a)
              drop-shadow(0 6px 9px rgba(0,0,0,.55));
  --tfx-edge-sm: drop-shadow(1.6px 0 0 #0a0a0a) drop-shadow(-1.6px 0 0 #0a0a0a) drop-shadow(0 1.6px 0 #0a0a0a) drop-shadow(0 -1.6px 0 #0a0a0a)
              drop-shadow(0 2px 6px rgba(0,0,0,.85));
}

/* --- 文字そのもののデザイン（.tfx-* を文字要素に付与） --- */
.tfx-mincho { font-family:"Mincho",serif; font-weight:900; }
.tfx-heavy  { font-family:"JPHeavy","Noto Sans JP",sans-serif; font-weight:900; }

/* 外向きアウトライン（白） */
.tfx-outline { color:#fff; filter:var(--tfx-edge); }

/* ゴールドグラデ文字（縁は外向きdrop-shadow） */
.tfx-gold { background:linear-gradient(180deg,#fff7c0 0%,#ffe060 34%,#e0a020 64%,#fff5b0 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:var(--tfx-edge); }

/* ソリッドゴールド（文字分割アニメ charRise/charPop 用＝background-clipを使わない） */
.tfx-gold-solid { color:#ffd84b; filter:var(--tfx-edge); }

  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:var(--tfx-edge); }

/* --- “枠/帯”系コンテナ（テキストを包む要素に付与） --- */
/* 赤帯（上下ゴールドライン） */
.tfxc-band { display:inline-block; padding:.18em .9em; background:linear-gradient(180deg,#d4001c,#7a0010);
  border-top:4px solid #ffd54a; border-bottom:4px solid #ffd54a; box-shadow:0 10px 26px rgba(0,0,0,.55); }

.tfxc-double { display:inline-block; padding:.22em 1em; border:4px solid #ffd54a; position:relative; background:rgba(8,8,10,.55); }
.tfxc-double::before { content:""; position:absolute; inset:7px; border:2px solid rgba(255,213,74,.7); pointer-events:none; }
/* 左アクセントバー */
.tfxc-leftbar { display:inline-block; padding:.1em .5em .1em .85em; position:relative; }
.tfxc-leftbar::before { content:""; position:absolute; left:0; top:14%; bottom:14%; width:10px; border-radius:5px; background:linear-gradient(180deg,#ffd84b,#ff7a00); box-shadow:0 0 12px rgba(255,150,0,.6); }
/* リボン（折れ角） */
.tfxc-ribbon { display:inline-block; padding:.2em 1.3em; position:relative; background:linear-gradient(180deg,#d4001c,#9a0014); box-shadow:0 8px 20px rgba(0,0,0,.5); }
.tfxc-ribbon::before,.tfxc-ribbon::after { content:""; position:absolute; top:100%; border:12px solid transparent; }

.tfxc-bracket { display:inline-block; padding:.16em 1.1em; position:relative; }

.tfxc-bracket::before { left:0; border-right:none; }
.tfxc-bracket::after  { right:0; border-left:none; }
/* スクリム（可読性パネル） */
.tfxc-scrim { padding:.4em 1em; border-radius:12px; background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.84) 0%, rgba(0,0,0,.6) 60%, rgba(0,0,0,0) 92%); }

/* ラベル小見出し（カードのsub用：ゴールド＋下線バー） */
.tfx-kicker { font-family:"JPHeavy"; color:#ffe89a; letter-spacing:.16em; position:relative; display:inline-block; padding-bottom:.4em;
  filter:var(--tfx-edge-sm); }
.tfx-kicker::after { content:""; position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:88px; height:4px; border-radius:2px; background:linear-gradient(90deg,#ffd84b,#ff7a00); box-shadow:0 0 10px rgba(255,150,0,.6); }

/* アンダースイープ用の下線要素 */
.tfx-uline { height:9px; width:0; margin:.18em auto 0; background:linear-gradient(90deg,transparent,#ffd84b 16%,#ff7a00 84%,transparent); }

ないか", "author": "格闘技ファン", "handle": "@yosou_daily", "verified": false, "initial": "S", "color": "#4d8a5a", "text": "未だに悩んでる、まじでどっちもある。触らせない展開なら秋元、組んだらクレベル。一発は秋元…", "likes": "—", "anon": true, "pos": "center", "start": 265.0, "end": 277.95}], "tally": [{"start": 75.79, "end": 84.56}], "srcs": [{"start": 0.0, "end": 12.794, "text": "映像: Pexels"}, {"start": 12.794, "end": 20.504, "text": "画像: RIZIN FF公式"}, {"start": 20.504, "end": 27.379, "text": "出典: YouTube「青木真也」"}, {"start": 27.379, "end": 36.575, "text": "画像: RIZIN FF公式"}, {"start": 36.575, "end": 41.488, "text": "出典: YouTube「おぎちゃんねる」"}, {"start": 41.488, "end": 45.39, "text": "画像: RIZIN FF公式"}, {"start": 45.39, "end": 56.165, "text": "試合映像: RIZIN"}, {"start": 56.165, "end": 68.38, "text": "出典: YouTube「秋元強真」"}, {"start": 68.38, "end": 75.487, "text": "試合映像: RIZIN"}, {"start": 75.487, "end": 87.087, "text": "映像: Pexels"}, {"start": 87.087, "end": 99.813, "text": "出典: YouTube「青木真也」"}, {"start": 99.813, "end": 109.242, "text": "出典: YouTube「ストロング金子/ストチャンネル」"}, {"start": 109.242, "end": 119.785, "text": "出典: YouTube「斎藤裕」"}, {"start": 119.785, "end": 131.303, "text": "出典: YouTube「川尻達也のじりラジオ」"}, {"start": 131.303, "end": 138.689, "text": "出典: YouTube「ジョビンチャンネル」"}, {"start": 138.689, "end": 148.21, "text": "出典: YouTube「伊澤星花」"}, {"start": 148.21, "end": 164.653, "text": "画像: RIZIN FF公式"}, {"start": 164.653, "end": 179.643, "text": "出典: YouTube「U-NEXT格闘技公式」"}, {"start": 179.643, "end": 182.756, "text": "試合映像: RIZIN"}, {"start": 182.756, "end": 192.881, "text": "出典: YouTube「おぎちゃんねる」"}, {"start": 192.881, "end": 203.656, "text": "出典: YouTube「松嶋こよみ」"}, {"start": 203.656, "end": 211.519, "text": "出典: YouTube「元谷友貴」"}, {"start": 211.519, "end": 219.382, "text": "試合映像: RIZIN"}, {"start": 219.382, "end": 240.085, "text": "出典: YouTube「U-NEXT格闘技公式」"}, {"start": 240.085, "end": 249.003, "text": "画像: RIZIN FF公式"}, {"start": 249.003, "end": 253.463, "text": "出典: YouTube「秋元強真」"}, {"start": 253.463, "end": 280.575, "text": "映像: Pexels"}, {"start": 280.575, "end": 285.267, "text": "出典: YouTube「おぎちゃんねる」"}, {"start": 285.267, "end": 288.937, "text": "画像: RIZIN FF公式"}, {"start": 288.937, "end": 301.369, "text": "出典: YouTube「青木真也」"}, {"start": 301.369, "end": 310.961, "text": "画像: RIZIN FF公式"}, {"start": 310.961, "end": 318.809, "text": "出典: YouTube「斎藤裕」"}, {"start": 318.809, "end": 364.326, "text": "画像: RIZIN FF公式"}, {"start": 364.326, "end": 375.241, "text": "出典: YouTube「石渡伸太郎」"}, {"start": 375.241, "end": 386.155, "text": "出典: YouTube「おぎちゃんねる」"}, {"start": 386.155, "end": 399.701, "text": "出典: YouTube「石渡伸太郎」"}, {"start": 399.701, "end": 405.275, "text": "画像: RIZIN FF公式"}, {"start": 405.275, "end": 418.467, "text": "映像: Pexels"}, {"start": 418.467, "end": 425.295, "text": "画像: RIZIN FF公式"}, {"start": 425.295, "end": 434.997, "text": "映像: Pexels"}], "caps": [{"s": 0.3, "e": 7.11, "lines": ["今回は、8月11日にトヨタアリーナ東京で", "開催される、RIZIN.54について、格闘家や"]}, {"s": 7.11, "e": 12.74, "lines": ["専門家がどんな勝敗予想をしているのかを、まと", "めてご紹介します。"]}, {"s": 12.79, "e": 19.66, "lines": ["注目のメインイベントは、元RIZINフェザー級王者ク", "レベル・コイケと、20歳の新星、秋元強真の"]}, {"s": 19.66, "e": 20.45, "lines": ["一戦です。"]}, {"s": 20.5, "e": 27.33, "lines": ["青木真也さんや川尻達也さんをはじめ、YouTubeで", "予想を語った15人の声を集計しました。"]}, {"s": 27.38, "e": 34.09, "lines": ["後半では、セミファイナルの佐藤将光対パッチー・", "ミックスや、平本丈対ジョリーなど、その他の"]}, {"s": 34.09, "e": 36.53, "lines": ["注目カードの予想も見ていきます。"]}, {"s": 36.58, "e": 39.06, "lines": ["それでは、さっそく見ていきましょう。"]}, {"s": 41.49, "e": 45.34, "lines": ["まずはメインイベント、クレベル・コイケ対秋元強", "真です。"]}, {"s": 45.39, "e": 52.6, "lines": ["クレベル・コイケは37歳。柔術を武器に、", "朝倉未来選手を一本で破るなど、数々の強豪を"]}, {"s": 52.6, "e": 56.12, "lines": ["下してきた、元RIZINフェザー級王者です。"]}, {"s": 56.16, "e": 63.78, "lines": ["対する秋元強真は、まだ20歳。現在5連勝中で、", "前戦ではあのパッチー・ミックスをKOしました。"]}, {"s": 63.78, "e": 68.33, "lines": ["今大会が、10試合目でのメインイベント抜擢と", "なります。"]}, {"s": 68.38, "e": 75.44, "lines": ["打撃と若さの秋元か、それとも寝技と経験の", "クレベルか。予想は大きく割れました。"]}, {"s": 75.49, "e": 83.25, "lines": ["集計の結果は、秋元が9人、クレベルが5人、", "五分が1人。まずは、秋元有利と見る声か"]}, {"s": 83.25, "e": 84.66, "lines": ["ら紹介します。"]}, {"s": 87.09, "e": 93.34, "lines": ["青木真也さんは、秋元の1ラウンド後半か", "ら2ラウンドでのKO勝ちを予想。クレベルが"]}, {"s": 93.34, "e": 99.76, "lines": ["組める距離にそもそも入れない、活路は一撃の", "関節技しかない、と圧倒を見込みます。"]}, {"s": 99.81, "e": 106.45, "lines": ["ストラッサー起一さんも、忖度なしで秋元。", "1ラウンドで組みを切って打撃、2ラウンドで"]}, {"s": 106.45, "e": 109.19, "lines": ["倒す、と2ラウンドKOを挙げました。"]}, {"s": 109.24, "e": 116.0, "lines": ["斎藤裕さんは、戦前の予想はやはり秋元有利の", "声が多い、と分析。ただし、ベストの"]}, {"s": 116.0, "e": 119.73, "lines": ["クレベルなら一本もある、と含みも残します。"]}, {"s": 119.78, "e": 126.95, "lines": ["川尻達也さんは、みんなが思うほど差は", "大きくない、若干秋元くらいだ、と僅差の秋元。"]}, {"s": 126.95, "e": 131.25, "lines": ["クレベルの数少ない勝ち筋は足関節だと", "指摘します。"]}, {"s": 131.3, "e": 137.57, "lines": ["ジョビンさんも秋元。ノリに乗っていて、体重も", "増やし、メンタル的にも充実している、と"]}, {"s": 137.57, "e": 138.64, "lines": ["評価しました。"]}, {"s": 138.69, "e": 145.52, "lines": ["女子スーパーアトム級王者の伊澤星花さんは、", "パッチー・ミックス戦と同じく触られないだろう、"]}, {"s": 145.52, "e": 148.16, "lines": ["秋元は速すぎる、と秋元を推します。"]}, {"s": 148.21, "e": 156.38, "lines": ["征矢貴さんも、秋元のKO勝ち。現在進行形で、", "どんどん強くなっている、と成長を高く買います。"]}, {"s": 156.43, "e": 163.61, "lines": ["火の鳥さんは、秋元がタックルを切ってボディを", "削り、左ストレートで1ラウンドKO、と具体的に"]}, {"s": 163.61, "e": 164.6, "lines": ["読みました。"]}, {"s": 164.65, "e": 171.09, "lines": ["そして金原正徳さんは、U-NEXTの公式予想番組で", "秋元の3ラウンドTKOを予想。クレベルが"]}, {"s": 171.09, "e": 177.21, "lines": ["触れられなければ、パッチー・ミックス戦の", "ように削られてしまう、と見ています。"]}, {"s": 179.64, "e": 182.71, "lines": ["一方で、クレベルを推したのが5人です。"]}, {"s": 182.76, "e": 189.58, "lines": ["扇久保博正さんは、クレベルがラストチャンスと", "死に物狂いで組みにいく、要所と離れ際の打撃で"]}, {"s": 189.58, "e": 192.83, "lines": ["意地を見せて判定勝ち、と接戦を予想します。"]}, {"s": 192.88, "e": 199.8, "lines": ["松嶋こよみさんは、クレベルの一本勝ち。秋元の", "打撃は速いけれど、踏み込んだところを"]}, {"s": 199.8, "e": 203.61, "lines": ["捕まえられて、下から三角絞め、と読みました。"]}, {"s": 203.66, "e": 209.37, "lines": ["そして、過去に秋元から勝利を", "挙げている元谷友貴さん。クレベルは決め力が"]}, {"s": 209.37, "e": 215.25, "lines": ["トップクラスで、尻上がりに調子を上げる、", "最後まで分からない選手。いい形を"]}, {"s": 215.25, "e": 219.33, "lines": ["作らせたら本当に危険だ、とクレベル寄りの", "見解です。"]}, {"s": 219.38, "e": 225.1, "lines": ["柔術家のホベルト・サトシ・ソウザさんは、", "1ラウンドは秋元の打撃が最も危険だけれど、"]}, {"s": 225.1, "e": 230.75, "lines": ["2ラウンドからはクレベルの投げと寝技に", "チャンスがある、とクレベルの2ラウンド一本を"]}, {"s": 230.75, "e": 231.59, "lines": ["予想します。"]}, {"s": 231.64, "e": 237.66, "lines": ["そして、クレベルに打撃を指導する鈴木博昭さんも", "、クレベルを支持しました。"]}, {"s": 240.09, "e": 246.49, "lines": ["五分と見たのは1人。太田忍さんは、どちらが", "勝ってもおかしくない、決着はフィニッシュに"]}, {"s": 246.49, "e": 248.95, "lines": ["なるだろう、と明言を避けました。"]}, {"s": 249.0, "e": 253.41, "lines": ["では、当の秋元強真本人は、どう語っているので", "しょうか。"]}, {"s": 253.46, "e": 260.11, "lines": ["本人は、練習で触られることがほとんどない、", "クレベルの崩し方は全部読めている、と自信を"]}, {"s": 260.11, "e": 264.7, "lines": ["見せます。あとは丁寧に頑張るだけ、と", "落ち着いた様子でした。"]}, {"s": 264.75, "e": 271.53, "lines": ["ファンの応援は秋元寄りが目立ちますが、予想は", "、秋元のKOと、クレベルの一本や判定で"]}, {"s": 271.53, "e": 278.15, "lines": ["真っ二つ。秋元を組める距離に入れさせないか、", "それが最大の分岐点になりそうです。"]}, {"s": 280.57, "e": 285.22, "lines": ["ここからは、その他の注目カードの予想を、まと", "めて見ていきましょう。"]}, {"s": 285.27, "e": 288.89, "lines": ["セミファイナルは、佐藤将光対パッチー・ミックス", "です。"]}, {"s": 288.94, "e": 294.48, "lines": ["青木真也さんはミックスがザバっと勝つと", "予想し、多くの予想者もミックス優勢と"]}, {"s": 294.48, "e": 299.87, "lines": ["見ています。ただし、全てはミックスの", "コンディションと計量次第、という声も"]}, {"s": 299.87, "e": 301.22, "lines": ["少なくありません。"]}, {"s": 301.37, "e": 307.68, "lines": ["平本丈対ジョリーは、1ラウンド勝負という見方が", "支配的です。1ラウンドでジョリーが"]}, {"s": 307.68, "e": 314.47, "lines": ["仕留めきれなければ、打たれ強い平本丈が打撃で", "優勢、と斎藤さんや石渡さんは平本を予想。"]}, {"s": 314.47, "e": 318.76, "lines": ["一方、秋元本人はジョリーの2ラウンド一本を", "推しました。"]}, {"s": 318.81, "e": 326.37, "lines": ["公式番組でも、伊澤星花さんは平本の判定、", "征矢貴さんは平本のKO、火の鳥さんはジョリーの"]}, {"s": 326.37, "e": 328.88, "lines": ["一本と、意見が割れています。"]}, {"s": 328.94, "e": 336.11, "lines": ["後藤丈治対アジズベク・テミロフは、真っ二つ。", "後藤の前蹴りや膝の距離感が生きれば判定、"]}, {"s": 336.11, "e": 340.22, "lines": ["テミロフの破壊力が爆発すればKO、という構図で", "す。"]}, {"s": 340.27, "e": 346.42, "lines": ["伊藤裕樹対アリベク・ガジャマトフは、伊藤が", "組みを切って打撃で圧倒できるかが鍵。"]}, {"s": 346.42, "e": 352.34, "lines": ["金原さんや斎藤さんは伊藤寄り、秋元本人は", "ガジャマトフのMMA力を評価しました。"]}, {"s": 352.39, "e": 358.89, "lines": ["組み技同士の対決、摩嶋一整対武田光司は、", "拮抗カード。短期決戦なら摩嶋、"]}, {"s": 358.89, "e": 364.28, "lines": ["長引けばレスリングとパワーの武田、と", "斎藤さんは分析します。"]}, {"s": 364.33, "e": 370.21, "lines": ["水野新太対リー・カイウェンは、ほぼ全員が", "水野を予想。細かく多彩な打撃と組みで、"]}, {"s": 370.21, "e": 375.19, "lines": ["カイウェンの大振りをポイントアウトする、と", "いう見立てが並びました。"]}, {"s": 375.24, "e": 382.48, "lines": ["上田幹雄対エドポロ・キングは、上田の蹴りと", "スピードが優勢という声が多数。おぎさんは、"]}, {"s": 382.48, "e": 386.1, "lines": ["上田の左上段回し蹴りでのKOを予想しました。"]}, {"s": 386.15, "e": 394.17, "lines": ["直樹対細川一颯は、総合力の直樹か、一発を", "持つ細川か。石渡さんは直樹の1ラウンド、"]}, {"s": 394.17, "e": 399.55, "lines": ["秋元本人は細川の1ラウンドKOと、こちらも", "割れています。"]}, {"s": 399.7, "e": 405.22, "lines": ["以上、RIZIN.54の勝敗予想を、まと", "めてお届けしました。"]}, {"s": 405.27, "e": 411.96, "lines": ["メインは秋元有利の声が優勢ながら、クレベルの", "逆転を推す実力者も、少なくありません。"]}, {"s": 412.01, "e": 417.2, "lines": ["皆さんは、どの試合の、どちらが勝つと", "思いますか。ぜひコメントで予想を"]}, {"s": 417.2, "e": 418.42, "lines": ["教えてください。"]}, {"s": 418.47, "e": 425.25, "lines": ["RIZIN.54は、8月11日、トヨタアリーナ東京で", "開催されます。"]}, {"s": 425.3, "e": 430.07, "lines": ["この動画が参考になったら、高評価と", "チャンネル登録をお願いします。"]}, {"s": 430.07, "e": 434.7, "lines": ["格闘ニュースラボでした。最後までご視聴ありが", "とうございました。"]}], "chapters": [{"sec": "s1_card", "start": 39.208, "end": 41.208, "title": "メインイベント", "sub": "クレベル・コイケ vs 秋元強真"}, {"sec": "s2_akimoto", "start": 84.807, "end": 86.807, "title": "秋元有利論", "sub": "9人が秋元を予想"}, {"sec": "s3_kleber", "start": 177.363, "end": 179.363, "title": "クレベル逆転論", "sub": "5人がクレベルを予想"}, {"sec": "s4_even", "start": 237.805, "end": 239.805, "title": "割れる予想", "sub": "五分、そして本人は"}, {"sec": "s5_semi", "start": 278.295, "end": 280.295, "title": "後半の注目カード", "sub": "セミファイナルほか"}], "channel": "格闘ニュースラボ"};
