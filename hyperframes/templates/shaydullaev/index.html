<!doctype html>
<!-- シェイドゥラエフ 完全解説 1920x1080【評伝型】 -->
<html>
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>/* ============================================================
   textfx.js — 動画用テキスト「アニメーション」登録ライブラリ（再利用）
   GSAP前提・seek安全（全て paused timeline tl に時刻 t で tween を積む）。
   使い方: TextFX.charRise(tl, el, t, {dur, stagger}); など。退場は TextFX.exit。
   HyperFramesルール順守: gsapのみ/同要素同プロパティ多重禁止/exitはオーバーレイのみ可。
   ============================================================ */
(function () {
  const g = () => window.gsap;

  // 文字を span.tfx-ch に分割（インラインブロック）。空白は保持。1回だけ実行。
  function splitChars(el) {
    if (el.__tfxSplit) return el.__tfxChars;
    const text = el.textContent;
    el.textContent = "";
    const chars = [];
    for (const ch of text) {
      const s = document.createElement("span");
      s.className = "tfx-ch";
      s.style.display = "inline-block";
      s.style.whiteSpace = "pre";
      s.textContent = ch;
      el.appendChild(s);
      if (ch !== " " && ch !== "　") chars.push(s);
    }
    el.__tfxSplit = true; el.__tfxChars = chars;
    return chars;
  }

  const TextFX = {
    // 文字が下からせり上がり（スタッガー）
    charRise(tl, el, t, o = {}) {
      const ch = splitChars(el); const tl2 = g();
      tl.fromTo(el, { opacity: 1 }, { opacity: 1, duration: 0.01 }, t);
      tl.fromTo(ch, { yPercent: 120, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "back.out(1.6)", stagger: o.stagger || 0.035 }, t);
    },
    // 文字がスケールでポップ
    charPop(tl, el, t, o = {}) {
      const ch = splitChars(el);
      tl.fromTo(ch, { scale: 0.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.45, ease: o.ease || "back.out(2)", stagger: o.stagger || 0.03 }, t);
    },
    // 左→右クリップワイプ表示
    wipe(tl, el, t, o = {}) {
      tl.fromTo(el, { clipPath: "inset(0 100% 0 0)", opacity: 1 },
        { clipPath: "inset(0 0% 0 0)", duration: o.dur || 0.8, ease: o.ease || "power4.out" }, t);
    },
    // 下からマスク表示（行が立ち上がる）
    riseMask(tl, el, t, o = {}) {
      tl.fromTo(el, { clipPath: "inset(110% 0 0 0)", yPercent: 18, opacity: 1 },
        { clipPath: "inset(0% 0 0 0)", yPercent: 0, duration: o.dur || 0.6, ease: o.ease || "power3.out" }, t);
    },
    // ふわっと上昇フェード
    fadeUp(tl, el, t, o = {}) {
      tl.fromTo(el, { y: o.y || 40, opacity: 0 },
        { y: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "power3.out" }, t);
    },
    // スケールポップ（要素全体）
    scalePop(tl, el, t, o = {}) {
      tl.fromTo(el, { scale: o.from || 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "back.out(1.7)" }, t);
    },
    // インパクトのあるスラム（大→等倍＋ブラー）
    slam(tl, el, t, o = {}) {
      tl.fromTo(el, { scale: o.from || 1.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.42, ease: o.ease || "power3.out" }, t);
      blurTween(tl, el, t, o.blur || 16, o.dur || 0.42);
    },
    // ブラーイン（焦点が合う）
    blurIn(tl, el, t, o = {}) {
      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: (o.dur || 0.5) * 0.8, ease: "power1.out" }, t);
      blurTween(tl, el, t, o.blur || 18, o.dur || 0.5);
    },
    // ライトスピード（斜めスライドイン）
    lightspeed(tl, el, t, o = {}) {
      tl.fromTo(el, { x: o.x || 140, skewX: -22, opacity: 0 },
        { x: 0, skewX: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "power3.out" }, t);
    },
    // 下線スイープ（.tfx-uline 等の幅0→width）
    underline(tl, el, t, width, o = {}) {
      tl.fromTo(el, { width: 0 }, { width: width, duration: o.dur || 0.5, ease: o.ease || "power2.out" }, t);
    },
    // ゴールド等のグラデにシャイン走らせ（要素は background-size:230% 100% 想定）
    shine(tl, el, t, o = {}) {
      tl.fromTo(el, { backgroundPositionX: "120%" }, { backgroundPositionX: "-20%", duration: o.dur || 1.0, ease: "power1.inOut" }, t);
    },
    // オーバーレイ退場（カード等のみ可。シーン遷移には使わない）
    exit(tl, el, t, o = {}) {
      tl.to(el, { opacity: 0, y: o.y || -12, duration: o.dur || 0.35, ease: "power1.in" }, t);
    },
  };

  // filterブラーをオブジェクトproxyでtween（seek時もonUpdateで反映）。完了でinline filterを消し、CSSクラスのfilterを復帰。
  function blurTween(tl, el, t, from, dur) {
    const p = { b: from };
    tl.to(p, {
      b: 0, duration: dur, ease: "power2.out",
      onUpdate() { el.style.filter = "blur(" + p.b.toFixed(2) + "px)"; },
      onComplete() { el.style.filter = ""; },
      onReverseComplete() { el.style.filter = "blur(" + from + "px)"; },
    }, t);
  }

  window.TextFX = TextFX;
})();
</script>
<style>
/* ============================================================
   textfx.css — 動画用テキスト「デザイン」クラス集（再利用ライブラリ）
   HyperFrames合成にinjectして使う。アニメーションは textfx.js (GSAP/seek安全)。
   参考: jajaaan css-headline / su-gi-rx font-design / 9-bb / quantaxis
   フォント前提: "Mincho"(極太明朝 GokubutoMincho) / "JPHeavy"(SourceHanSans Heavy)
   ============================================================ */

/* 【縁取りは“外向きのみ”＝drop-shadow積層】-webkit-text-stroke(中央寄せ=字を細らせる)は大型文字で使わない。
   下記の --tfx-edge / --tfx-edge-sm を filter で重ね、グリフを太いまま外側だけに縁を付ける。 */
:root {
  --tfx-edge: drop-shadow(3px 0 0 #0a0a0a) drop-shadow(-3px 0 0 #0a0a0a) drop-shadow(0 3px 0 #0a0a0a) drop-shadow(0 -3px 0 #0a0a0a)
              drop-shadow(2.1px 2.1px 0 #0a0a0a) drop-shadow(-2.1px -2.1px 0 #0a0a0a) drop-shadow(2.1px -2.1px 0 #0a0a0a) drop-shadow(-2.1px 2.1px 0 #0a0a0a)
              drop-shadow(0 6px 9px rgba(0,0,0,.55));
  --tfx-edge-sm: drop-shadow(1.6px 0 0 #0a0a0a) drop-shadow(-1.6px 0 0 #0a0a0a) drop-shadow(0 1.6px 0 #0a0a0a) drop-shadow(0 -1.6px 0 #0a0a0a)
              drop-shadow(0 2px 6px rgba(0,0,0,.85));
}

/* --- 文字そのもののデザイン（.tfx-* を文字要素に付与） --- */
.tfx-mincho { font-family:"Mincho",serif; font-weight:900; }
.tfx-heavy  { font-family:"JPHeavy","Noto Sans JP",sans-serif; font-weight:900; }

/* 外向きアウトライン（白） */
.tfx-outline { color:#fff; filter:var(--tfx-edge); }
.tfx-outline-thin { color:#fff; filter:var(--tfx-edge-sm); }

/* ゴールドグラデ文字（縁は外向きdrop-shadow） */
.tfx-gold { background:linear-gradient(180deg,#fff7c0 0%,#ffe060 34%,#e0a020 64%,#fff5b0 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:var(--tfx-edge); }

/* ソリッドゴールド（文字分割アニメ charRise/charPop 用＝background-clipを使わない） */
.tfx-gold-solid { color:#ffd84b; filter:var(--tfx-edge); }

/* 赤金グラデ（情熱系） */
.tfx-fire { background:linear-gradient(180deg,#fff2c0 0%,#ffb43c 38%,#ff5a2a 72%,#c81818 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:var(--tfx-edge); }

/* ネオン発光（暗背景向け） */
.tfx-neon { color:#fff; text-shadow:0 0 8px #ffe14a,0 0 18px #ffb000,0 0 34px #ff7a00,0 3px 6px rgba(0,0,0,.7); }
.tfx-neon-blue { color:#eaf6ff; text-shadow:0 0 8px #6cd6ff,0 0 18px #2aa8ff,0 0 34px #0a6cff,0 3px 6px rgba(0,0,0,.7); }

/* ポップ／レトロ（ハードな色影・ブラー0。縁は外向き） */
.tfx-pop { color:#fff; filter:var(--tfx-edge); text-shadow:7px 7px 0 #c80018; }

/* 3D 立体（多層オフセット影） */
.tfx-emboss { color:#ffd84b; text-shadow:0 1px 0 #b8860b,0 2px 0 #a5760a,0 3px 0 #8f6608,0 4px 0 #7a5607,0 6px 8px rgba(0,0,0,.7); filter:var(--tfx-edge-sm); }

/* マーカー蛍光（下半分ハイライト・行内spanに付与） */
.tfx-marker { background:linear-gradient(transparent 58%, rgba(255,221,51,.85) 58%); padding:0 .06em; }
.tfx-marker-red { background:linear-gradient(transparent 58%, rgba(255,60,80,.8) 58%); padding:0 .06em; }

/* 斜めストライプ塗り文字 */
.tfx-stripe { background:repeating-linear-gradient(45deg,#ffd84b 0 10px,#e0a020 10px 20px);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:var(--tfx-edge); }

/* --- “枠/帯”系コンテナ（テキストを包む要素に付与） --- */
/* 赤帯（上下ゴールドライン） */
.tfxc-band { display:inline-block; padding:.18em .9em; background:linear-gradient(180deg,#d4001c,#7a0010);
  border-top:4px solid #ffd54a; border-bottom:4px solid #ffd54a; box-shadow:0 10px 26px rgba(0,0,0,.55); }
/* 二重枠 */
.tfxc-double { display:inline-block; padding:.22em 1em; border:4px solid #ffd54a; position:relative; background:rgba(8,8,10,.55); }
.tfxc-double::before { content:""; position:absolute; inset:7px; border:2px solid rgba(255,213,74,.7); pointer-events:none; }
/* 左アクセントバー */
.tfxc-leftbar { display:inline-block; padding:.1em .5em .1em .85em; position:relative; }
.tfxc-leftbar::before { content:""; position:absolute; left:0; top:14%; bottom:14%; width:10px; border-radius:5px; background:linear-gradient(180deg,#ffd84b,#ff7a00); box-shadow:0 0 12px rgba(255,150,0,.6); }
/* リボン（折れ角） */
.tfxc-ribbon { display:inline-block; padding:.2em 1.3em; position:relative; background:linear-gradient(180deg,#d4001c,#9a0014); box-shadow:0 8px 20px rgba(0,0,0,.5); }
.tfxc-ribbon::before,.tfxc-ribbon::after { content:""; position:absolute; top:100%; border:12px solid transparent; }
.tfxc-ribbon::before { left:0; border-top-color:#6a000e; border-left-color:#6a000e; }
.tfxc-ribbon::after  { right:0; border-top-color:#6a000e; border-right-color:#6a000e; }
/* コーナーブラケット [ ] */
.tfxc-bracket { display:inline-block; padding:.16em 1.1em; position:relative; }
.tfxc-bracket::before,.tfxc-bracket::after { content:""; position:absolute; top:0; bottom:0; width:24px; border:5px solid #ffd54a; }
.tfxc-bracket::before { left:0; border-right:none; }
.tfxc-bracket::after  { right:0; border-left:none; }
/* スクリム（可読性パネル） */
.tfxc-scrim { padding:.4em 1em; border-radius:12px; background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.84) 0%, rgba(0,0,0,.6) 60%, rgba(0,0,0,0) 92%); }

/* ラベル小見出し（カードのsub用：ゴールド＋下線バー） */
.tfx-kicker { font-family:"JPHeavy"; color:#ffe89a; letter-spacing:.16em; position:relative; display:inline-block; padding-bottom:.4em;
  filter:var(--tfx-edge-sm); }
.tfx-kicker::after { content:""; position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:88px; height:4px; border-radius:2px; background:linear-gradient(90deg,#ffd84b,#ff7a00); box-shadow:0 0 10px rgba(255,150,0,.6); }

/* アンダースイープ用の下線要素 */
.tfx-uline { height:9px; width:0; margin:.18em auto 0; background:linear-gradient(90deg,transparent,#ffd84b 16%,#ff7a00 84%,transparent); }

N FF"}, {"start": 452.034, "end": 482.034, "text": "試合映像: RIZIN FF"}, {"start": 482.334, "end": 507.743, "text": "出典: RIZIN FF"}, {"start": 507.743, "end": 537.743, "text": "試合映像: RIZIN FF"}, {"start": 538.043, "end": 582.814, "text": "出典: RIZIN FF"}, {"start": 582.814, "end": 612.814, "text": "試合映像: RIZIN FF"}, {"start": 613.114, "end": 653.983, "text": "出典: RIZIN FF"}, {"start": 653.983, "end": 686.983, "text": "試合映像: RIZIN FF"}, {"start": 687.283, "end": 712.889, "text": "出典: RIZIN FF"}, {"start": 712.889, "end": 742.889, "text": "試合映像: RIZIN FF"}, {"start": 743.189, "end": 763.015, "text": "出典: RIZIN FF"}, {"start": 763.015, "end": 793.015, "text": "試合映像: RIZIN FF"}, {"start": 793.315, "end": 891.359, "text": "出典: RIZIN FF"}, {"start": 891.359, "end": 901.69, "text": "出典: UAE Warriors"}, {"start": 901.69, "end": 1041.407, "text": "出典: RIZIN FF"}], "caps": [{"s": 0.3, "e": 8.72, "lines": ["19戦19勝、無敗。そのうち19試合すべてがKOか", "一本。判定は、ただの一度もない。"]}, {"s": 8.77, "e": 15.43, "lines": ["RIZINフェザー級の絶対王者、ラジャブアリ・シェイ", "ドゥラエフ。異名はキルギスの犬鷲。"]}, {"s": 15.48, "e": 23.2, "lines": ["武田光司、アーチュレッタ、クレベル・コイケ、", "そして朝倉未来。日本のリングに立った強豪を、"]}, {"s": 23.2, "e": 25.48, "lines": ["彼はことごとく葬ってきた。"]}, {"s": 25.54, "e": 33.53, "lines": ["9月10日、京セラドーム大阪。この無敗の怪物が、", "PFL最強AJ・マッキーと、史上初の"]}, {"s": 33.53, "e": 35.96, "lines": ["2団体王座統一戦に臨む。"]}, {"s": 36.01, "e": 41.99, "lines": ["しかしこの男が、キルギスの山で鷲と走り、棒に", "釘を打ってオオカミと戦おうと"]}, {"s": 41.99, "e": 44.99, "lines": ["した少年だったことを知る人は少ない。"]}, {"s": 45.04, "e": 51.46, "lines": ["今回はこの動画さえ見れば全てわかる。", "生い立ちから、RIZIN参戦前の海外での試合も"]}, {"s": 51.46, "e": 56.29, "lines": ["含めた全19戦、そしてファイトスタイルまで、", "完全に振り返る。"]}, {"s": 56.34, "e": 62.54, "lines": ["全試合フィニッシュの怪物の正体を、最後まで", "見届けてほしい。それでは行きましょう。"]}, {"s": 64.99, "e": 68.17, "lines": ["まずは彼が何者なのかをおさらいしよう。"]}, {"s": 68.22, "e": 74.27, "lines": ["ラジャブアリ・シェイドゥラエフ。2000年10月11日", "生まれの25歳。"]}, {"s": 74.32, "e": 80.61, "lines": ["キルギスの首都ビシュケクを拠点とし、生まれは", "タジキスタンとの国境に近い小さな村だ。"]}, {"s": 80.66, "e": 86.62, "lines": ["身長170センチ、リーチ174センチ。フェザー級。"]}, {"s": 86.67, "e": 95.8, "lines": ["戦績はプロ19戦19勝、無敗。KOが7、一本が12。", "判定はゼロ。全ての試合をフィニッシュで"]}, {"s": 95.8, "e": 97.6, "lines": ["終わらせている。"]}, {"s": 97.65, "e": 105.33, "lines": ["異名は、キルギスの犬鷲。空高くから獲物を", "仕留める猛禽になぞらえた、恐るべき二つ名だ。"]}, {"s": 105.38, "e": 109.26, "lines": ["その原点は、キルギスの大自然の中にあった。"]}, {"s": 111.71, "e": 119.91, "lines": ["彼の物語は、キルギスの実家から始まる。父と", "兄弟たちと暮らす家で、4人兄弟の三男一女の"]}, {"s": 119.91, "e": 121.29, "lines": ["家庭に育った。"]}, {"s": 121.34, "e": 128.69, "lines": ["父はこう証言している。ラジャブアリは幼い頃か", "ら活発で、馬やロバに乗り、あちこちで問題を"]}, {"s": 128.69, "e": 130.74, "lines": ["起こす勇敢な子だったと。"]}, {"s": 130.79, "e": 138.12, "lines": ["父を驚かせた、こんな逸話がある。幼い彼が、", "長い棒にたくさんの釘を打ち込んでいた。何を"]}, {"s": 138.12, "e": 141.44, "lines": ["しているのかと聞くと、彼はこう答えた。"]}, {"s": 141.49, "e": 146.16, "lines": ["夜にオオカミが家に来たら、追い払うための", "道具だ、と。"]}, {"s": 146.21, "e": 153.22, "lines": ["武道は誰かに勧められて始めたわけではない。", "本人は語っている。子供の頃から毎朝走り、"]}, {"s": 153.22, "e": 160.24, "lines": ["サンドバッグを叩いていた。世界レベルの", "武道家になりたくて、自分の意思でやってきたの"]}, {"s": 160.24, "e": 160.76, "lines": ["だと。"]}, {"s": 160.81, "e": 167.82, "lines": ["兄弟たちは日用品でトレーニング器具や", "サンドバッグを自作し、身体を鍛えた。武道は、"]}, {"s": 167.82, "e": 170.63, "lines": ["この一家の生き方そのものだった。"]}, {"s": 173.08, "e": 179.36, "lines": ["シェイドゥラエフの強さの土台は、レスリング、", "柔道、そしてブラジリアン柔術にある。"]}, {"s": 179.41, "e": 186.34, "lines": ["彼はコンバット柔術のアジア王者。自室には", "2019年からのメダルがずらりと並ぶ。"]}, {"s": 186.34, "e": 188.77, "lines": ["組み技こそが、彼の原点だ。"]}, {"s": 188.82, "e": 197.39, "lines": ["トレーニングは毎日、朝2時間、夜2時間。週末は", "必ずキルギスの山を走る。高地トレーニングで、"]}, {"s": 197.39, "e": 200.31, "lines": ["呼吸器と持久力を鍛えるためだ。"]}, {"s": 200.36, "e": 209.21, "lines": ["そして彼の異名、犬鷲。本人はこう語る。我々の", "祖先は鷲を使って狩りをした。鷲は猛禽の王。"]}, {"s": 209.21, "e": 214.35, "lines": ["その爪と嘴は武器であり、速く、そして容赦が", "ないと。"]}, {"s": 214.4, "e": 220.7, "lines": ["憧れの選手は、あの伝説エメリヤーエンコ・ヒョー", "ドル。プライドの時代から、その戦いを"]}, {"s": 220.7, "e": 221.62, "lines": ["見て育った。"]}, {"s": 221.67, "e": 226.29, "lines": ["組み技の申し子は、やがて世界の舞台へと", "羽ばたいていく。"]}, {"s": 228.74, "e": 233.68, "lines": ["2019年、シェイドゥラエフは地元キルギスで", "プロデビューを果たす。"]}, {"s": 233.73, "e": 239.04, "lines": ["Batyr Bashyをはじめとする現地の大会で、彼は", "無敗街道を突き進む。"]}, {"s": 239.09, "e": 245.11, "lines": ["三角絞め、膝十字、ヒールフック、", "リアネイキドチョーク。相手を選ばず、"]}, {"s": 245.11, "e": 249.19, "lines": ["あらゆる関節技と絞め技で一本を量産していった。"]}, {"s": 249.24, "e": 256.33, "lines": ["デビューからの試合、そのほとんどを1ラウンド、", "2ラウンドの一本勝ち。柔術の申し子の"]}, {"s": 256.33, "e": 257.75, "lines": ["面目躍如だった。"]}, {"s": 257.8, "e": 265.49, "lines": ["2020年8月には、地元キルギスの大会で", "フェザー級王座を獲得。国内の頂点に立った彼の"]}, {"s": 265.49, "e": 268.41, "lines": ["目は、すでに海の外を見ていた。"]}, {"s": 270.86, "e": 274.73, "lines": ["まず彼が乗り込んだのは、格闘技大国ロシアだ。"]}, {"s": 274.78, "e": 280.9, "lines": ["ここで注目したいのが、彼の階級だ。この", "海外挑戦の時期、シェイドゥラエフは"]}, {"s": 280.9, "e": 288.3, "lines": ["今より一階級軽いバンタム級で戦っていた。の", "ちのRIZINでのフェザー級よりも軽い体で、世界の"]}, {"s": 288.3, "e": 290.17, "lines": ["強豪に挑んでいたのだ。"]}, {"s": 290.22, "e": 297.08, "lines": ["参戦したのは、強豪の登竜門ACA Young Eagles。", "ここでも彼は、3試合すべてを打撃と絞めで"]}, {"s": 297.08, "e": 299.06, "lines": ["フィニッシュしてみせた。"]}, {"s": 299.11, "e": 305.77, "lines": ["中でも特筆すべきが、2022年の", "アスワド・アフマトフ戦。実はこの試合こそ、"]}, {"s": 305.77, "e": 310.14, "lines": ["19戦を通じて彼が唯一ダウンを喫した一戦だった。"]}, {"s": 310.19, "e": 316.25, "lines": ["だが、シェイドゥラエフは全く動じなかった。", "フラッシュダウンからすぐさま立て直すと、"]}, {"s": 316.25, "e": 322.47, "lines": ["アナコンダチョークで一本勝ち。ただ一度の", "ピンチすら、彼は瞬時にねじ伏せてみせたのだ。"]}, {"s": 322.52, "e": 331.55, "lines": ["2023年6月、舞台は韓国。Road FC 64で、地元の", "実力者ヤン・ジヨンと対戦する。"]}, {"s": 336.85, "e": 344.2, "lines": ["1ラウンド、リアネイキドチョークで一本勝ち。", "アウェーの韓国でも、彼の強さは揺るがなかった。"]}, {"s": 344.25, "e": 352.26, "lines": ["そして同じ年の10月、中東UAE。UAE Warriorsで、", "これもリアネイキドチョークで相手を仕留める。"]}, {"s": 352.31, "e": 359.76, "lines": ["キルギス、ロシア、韓国、UAE。世界を", "渡り歩いて積み上げた戦績は、実に12戦12勝、"]}, {"s": 359.76, "e": 366.63, "lines": ["全てフィニッシュ。この完璧な無敗記録に、", "ついに日本のRIZINが目をつけた。"]}, {"s": 369.08, "e": 377.37, "lines": ["2024年6月、RIZIN.47。シェイドゥラエフは、", "鳴り物入りで日本のリングに初登場する。"]}, {"s": 377.42, "e": 384.86, "lines": ["デビュー戦の相手は、武田光司。RIZINライト級の", "トーナメントで準優勝するなど、日本の最前線で"]}, {"s": 384.86, "e": 387.7, "lines": ["戦ってきたトップクラスの実力者だ。"]}, {"s": 387.75, "e": 393.91, "lines": ["誰もが、日本の壁がこの新鋭を試すと", "思っていた。まずは、そのデビュー戦を"]}, {"s": 393.91, "e": 394.97, "lines": ["見てほしい。"]}, {"s": 425.27, "e": 432.22, "lines": ["1ラウンド、リアネイキドチョーク。武田を一本で", "沈め、日本のファンにその名を刻みつけた。"]}, {"s": 432.22, "e": 434.01, "lines": ["衝撃のデビューだった。"]}, {"s": 434.06, "e": 442.15, "lines": ["続く2戦目、2024年9月のRIZIN48。相手は、", "フアン・アーチュレッタ。アメリカの強豪で、"]}, {"s": 442.15, "e": 445.74, "lines": ["元ベラトールのバンタム級世界王者だ。"]}, {"s": 445.79, "e": 452.03, "lines": ["世界王座を経験した実力者。だが、この男の前で", "は関係なかった。"]}, {"s": 482.33, "e": 488.2, "lines": ["1ラウンド、腕ひしぎ十字固め。", "世界王者経験者すらも、彼は一本で"]}, {"s": 488.2, "e": 489.74, "lines": ["仕留めてみせた。"]}, {"s": 492.19, "e": 498.66, "lines": ["2024年の大晦日、RIZIN49。3戦目の相手は、", "久保優太。"]}, {"s": 498.71, "e": 506.41, "lines": ["元K-1の三冠王者。キックボクシング出身の、", "打撃の名手だ。グラップラーが、打撃巧者に"]}, {"s": 506.41, "e": 507.74, "lines": ["どう挑むのか。"]}, {"s": 538.04, "e": 545.35, "lines": ["2ラウンド、TKO。打撃自慢の相手を前に、", "シェイドゥラエフは打ち合いでも上回ってみせた。"]}, {"s": 545.4, "e": 553.65, "lines": ["RIZIN参戦から、わずか3連勝。全て一本かTKOの", "フィニッシュ。彼はあっという間に、王座挑戦の"]}, {"s": 553.65, "e": 555.17, "lines": ["資格を手にする。"]}, {"s": 555.22, "e": 559.75, "lines": ["そして立ちはだかるのが、絶対王者クレベル・コイ", "ケだった。"]}, {"s": 562.2, "e": 570.47, "lines": ["2025年5月、RIZIN男祭り。相手は、柔術の鬼に", "して長期政権を築くフェザー級王者、"]}, {"s": 570.47, "e": 572.43, "lines": ["クレベル・コイケ。"]}, {"s": 572.48, "e": 579.43, "lines": ["クレベルは、あの朝倉未来や鈴木千裕をも", "下してきた、日本フェザー級最強の男だ。誰もが"]}, {"s": 579.43, "e": 582.81, "lines": ["、シェイドゥラエフ最大の試練だと考えた。"]}, {"s": 613.11, "e": 620.22, "lines": ["だが、わずか1分2秒。右のフックがクレベルを", "打ち抜いた。柔術王者が、キャリアで"]}, {"s": 620.22, "e": 623.21, "lines": ["初めてKO負けを喫した瞬間だった。"]}, {"s": 623.26, "e": 630.92, "lines": ["第7代RIZINフェザー級王者、ラジャブアリ・シェイ", "ドゥラエフ誕生。彼は宣言する。このベルトを、"]}, {"s": 630.92, "e": 632.8, "lines": ["キルギスに持ち帰ると。"]}, {"s": 632.85, "e": 637.28, "lines": ["無敗のまま、彼はついに日本の頂点に立った。"]}, {"s": 639.73, "e": 644.86, "lines": ["王座を獲った男の快進撃は、防衛戦でさらに", "加速する。"]}, {"s": 644.91, "e": 653.58, "lines": ["2025年9月、名古屋でのRIZIN51。初防衛戦の", "相手は、ロシアのベテラン、ビクター・コレスニッ"]}, {"s": 653.58, "e": 653.98, "lines": ["ク。"]}, {"s": 687.28, "e": 693.43, "lines": ["開始わずか33秒でTKO。まばたきする間に、試合は", "終わっていた。"]}, {"s": 693.48, "e": 703.58, "lines": ["そして2025年の大晦日。2度目の防衛戦の相手は、", "日本で最も有名なMMAファイターの一人、朝倉未来。"]}, {"s": 703.63, "e": 710.64, "lines": ["YouTubeの登録者数百万人を抱える、", "日本格闘技界最大のスターだ。日本中が、この"]}, {"s": 710.64, "e": 712.89, "lines": ["ビッグマッチに注目した。"]}, {"s": 743.19, "e": 751.72, "lines": ["1ラウンド2分54秒、TKO。投げ技で翻弄し、", "パウンドで圧倒。日本中が見守った一戦を、彼は"]}, {"s": 751.72, "e": 753.98, "lines": ["一方的に制してみせた。"]}, {"s": 754.03, "e": 763.01, "lines": ["さらに2026年4月、福岡。3度目の防衛戦は、か", "つて破った打撃巧者、久保優太との再戦だった。"]}, {"s": 793.32, "e": 801.47, "lines": ["1ラウンド終盤、パウンドで粉砕。二度目の対戦も", "、危なげなく退けた。RIZIN無敗のまま、彼は"]}, {"s": 801.47, "e": 803.55, "lines": ["王座を守り続けている。"]}, {"s": 806.0, "e": 813.46, "lines": ["朝倉未来を倒したあたりから、彼の去就が", "大きな話題になっていく。次はUFCへ行くのでは"]}, {"s": 813.46, "e": 814.57, "lines": ["ないか、と。"]}, {"s": 814.62, "e": 821.86, "lines": ["本人も公言した。RIZINとの契約は、残り2試合。", "それが終われば、UFCへ。階級は"]}, {"s": 821.86, "e": 825.83, "lines": ["おそらくフェザー級で、世界に挑みたいと。"]}, {"s": 825.88, "e": 833.65, "lines": ["そんな中、動いたのはPFLだった。2026年7月、", "PFLがマッキーとの一戦をオファー。"]}, {"s": 833.65, "e": 841.32, "lines": ["マッキー本人もこれを快諾し、9月10日の", "2団体王座統一戦が実現することになる。"]}, {"s": 843.77, "e": 847.55, "lines": ["ここでシェイドゥラエフのファイトスタイルを", "徹底解剖しよう。"]}, {"s": 847.6, "e": 854.1, "lines": ["彼の根幹は、レスリングと柔術で", "磨き上げたグラップリングだ。テイクダウンか"]}, {"s": 854.1, "e": 862.06, "lines": ["ら一気に極めに移行する速さと精度は、まさに", "アジア王者級。19勝のうち12が、この一本勝ちだ。"]}, {"s": 862.11, "e": 870.51, "lines": ["だが恐ろしいのは、打撃も一級品だという点だ。", "クレベル戦の右フック一発によるKOが示す通り、"]}, {"s": 870.51, "e": 877.68, "lines": ["彼は立っていても相手を眠らせることができる。", "7つのKOが、その二面性を物語る。"]}, {"s": 877.73, "e": 884.44, "lines": ["最大の特徴は、19戦すべてをフィニッシュし、", "判定が一度もないこと。彼は常に、相手を"]}, {"s": 884.44, "e": 891.31, "lines": ["仕留めきる。1ラウンド、長くても2ラウンドで", "試合を終わらせる、異常なまでの決定力だ。"]}, {"s": 891.36, "e": 897.95, "lines": ["強いて弱点を探すなら、判定にも", "つれ込む長期戦の経験が皆無なこと。5ラウンドを"]}, {"s": 897.95, "e": 901.64, "lines": ["戦い抜いた経験がない点は、未知数と言える。"]}, {"s": 901.69, "e": 907.19, "lines": ["そしてその未知数こそが、9月10日のマッキー戦、", "最大の
