<!doctype html>
<!-- シェイドゥラエフ 完全解説 1920x1080【評伝型】 -->
<html>
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>/* ============================================================
   textfx.js — 動画用テキスト「アニメーション」登録ライブラリ（再利用）
   GSAP前提・seek安全（全て paused timeline tl に時刻 t で tween を積む）。
   使い方: TextFX.charRise(tl, el, t, {dur, stagger}); など。退場は TextFX.exit。
   HyperFramesルール順守: gsapのみ/同要素同プロパティ多重禁止/exitはオーバーレイのみ可。
   ============================================================ */
(function () {
  const g = () => window.gsap;

  // 文字を span.tfx-ch に分割（インラインブロック）。空白は保持。1回だけ実行。
  function splitChars(el) {
    if (el.__tfxSplit) return el.__tfxChars;
    const text = el.textContent;
    el.textContent = "";
    const chars = [];
    for (const ch of text) {
      const s = document.createElement("span");
      s.className = "tfx-ch";
      s.style.display = "inline-block";
      s.style.whiteSpace = "pre";
      s.textContent = ch;
      el.appendChild(s);
      if (ch !== " " && ch !== "　") chars.push(s);
    }
    el.__tfxSplit = true; el.__tfxChars = chars;
    return chars;
  }

  const TextFX = {
    // 文字が下からせり上がり（スタッガー）
    charRise(tl, el, t, o = {}) {
      const ch = splitChars(el); const tl2 = g();
      tl.fromTo(el, { opacity: 1 }, { opacity: 1, duration: 0.01 }, t);
      tl.fromTo(ch, { yPercent: 120, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "back.out(1.6)", stagger: o.stagger || 0.035 }, t);
    },
    // 文字がスケールでポップ
    charPop(tl, el, t, o = {}) {
      const ch = splitChars(el);
      tl.fromTo(ch, { scale: 0.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.45, ease: o.ease || "back.out(2)", stagger: o.stagger || 0.03 }, t);
    },
    // 左→右クリップワイプ表示
    wipe(tl, el, t, o = {}) {
      tl.fromTo(el, { clipPath: "inset(0 100% 0 0)", opacity: 1 },
        { clipPath: "inset(0 0% 0 0)", duration: o.dur || 0.8, ease: o.ease || "power4.out" }, t);
    },
    // 下からマスク表示（行が立ち上がる）
    riseMask(tl, el, t, o = {}) {
      tl.fromTo(el, { clipPath: "inset(110% 0 0 0)", yPercent: 18, opacity: 1 },
        { clipPath: "inset(0% 0 0 0)", yPercent: 0, duration: o.dur || 0.6, ease: o.ease || "power3.out" }, t);
    },
    // ふわっと上昇フェード
    fadeUp(tl, el, t, o = {}) {
      tl.fromTo(el, { y: o.y || 40, opacity: 0 },
        { y: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "power3.out" }, t);
    },
    // スケールポップ（要素全体）
    scalePop(tl, el, t, o = {}) {
      tl.fromTo(el, { scale: o.from || 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "back.out(1.7)" }, t);
    },
    // インパクトのあるスラム（大→等倍＋ブラー）
    slam(tl, el, t, o = {}) {
      tl.fromTo(el, { scale: o.from || 1.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.42, ease: o.ease || "power3.out" }, t);
      blurTween(tl, el, t, o.blur || 16, o.dur || 0.42);
    },
    // ブラーイン（焦点が合う）
    blurIn(tl, el, t, o = {}) {
      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: (o.dur || 0.5) * 0.8, ease: "power1.out" }, t);
      blurTween(tl, el, t, o.blur || 18, o.dur || 0.5);
    },
    // ライトスピード（斜めスライドイン）
    lightspeed(tl, el, t, o = {}) {
      tl.fromTo(el, { x: o.x || 140, skewX: -22, opacity: 0 },
        { x: 0, skewX: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "power3.out" }, t);
    },
    // 下線スイープ（.tfx-uline 等の幅0→width）
    underline(tl, el, t, width, o = {}) {
      tl.fromTo(el, { width: 0 }, { width: width, duration: o.dur || 0.5, ease: o.ease || "power2.out" }, t);
    },
    // ゴールド等のグラデにシャイン走らせ（要素は background-size:230% 100% 想定）
    shine(tl, el, t, o = {}) {
      tl.fromTo(el, { backgroundPositionX: "120%" }, { backgroundPositionX: "-20%", duration: o.dur || 1.0, ease: "power1.inOut" }, t);
    },
    // オーバーレイ退場（カード等のみ可。シーン遷移には使わない）
    exit(tl, el, t, o = {}) {
      tl.to(el, { opacity: 0, y: o.y || -12, duration: o.dur || 0.35, ease: "power1.in" }, t);
    },
  };

  // filterブラーをオブジェクトproxyでtween（seek時もonUpdateで反映）。完了でinline filterを消し、CSSクラスのfilterを復帰。
  function blurTween(tl, el, t, from, dur) {
    const p = { b: from };
    tl.to(p, {
      b: 0, duration: dur, ease: "power2.out",
      onUpdate() { el.style.filter = "blur(" + p.b.toFixed(2) + "px)"; },
      onComplete() { el.style.filter = ""; },
      onReverseComplete() { el.style.filter = "blur(" + from + "px)"; },
    }, t);
  }

  window.TextFX = TextFX;
})();
</script>
<style>
/* ============================================================
   textfx.css — 動画用テキスト「デザイン」クラス集（再利用ライブラリ）
   HyperFrames合成にinjectして使う。アニメーションは textfx.js (GSAP/seek安全)。
   参考: jajaaan css-headline / su-gi-rx font-design / 9-bb / quantaxis
   フォント前提: "Mincho"(極太明朝 GokubutoMincho) / "JPHeavy"(SourceHanSans Heavy)
   ============================================================ */

/* 【縁取りは“外向きのみ”＝drop-shadow積層】-webkit-text-stroke(中央寄せ=字を細らせる)は大型文字で使わない。
   下記の --tfx-edge / --tfx-edge-sm を filter で重ね、グリフを太いまま外側だけに縁を付ける。 */
:root {
  --tfx-edge: drop-shadow(3px 0 0 #0a0a0a) drop-shadow(-3px 0 0 #0a0a0a) drop-shadow(0 3px 0 #0a0a0a) drop-shadow(0 -3px 0 #0a0a0a)
              drop-shadow(2.1px 2.1px 0 #0a0a0a) drop-shadow(-2.1px -2.1px 0 #0a0a0a) drop-shadow(2.1px -2.1px 0 #0a0a0a) drop-shadow(-2.1px 2.1px 0 #0a0a0a)
              drop-shadow(0 6px 9px rgba(0,0,0,.55));
  --tfx-edge-sm: drop-shadow(1.6px 0 0 #0a0a0a) drop-shadow(-1.6px 0 0 #0a0a0a) drop-shadow(0 1.6px 0 #0a0a0a) drop-shadow(0 -1.6px 0 #0a0a0a)
              drop-shadow(0 2px 6px rgba(0,0,0,.85));
}

/* --- 文字そのもののデザイン（.tfx-* を文字要素に付与） --- */
.tfx-mincho { font-family:"Mincho",serif; font-weight:900; }
.tfx-heavy  { font-family:"JPHeavy","Noto Sans JP",sans-serif; font-weight:900; }

/* 外向きアウトライン（白） */
.tfx-outline { color:#fff; filter:var(--tfx-edge); }
.tfx-outline-thin { color:#fff; filter:var(--tfx-edge-sm); }

/* ゴールドグラデ文字（縁は外向きdrop-shadow） */
.tfx-gold { background:linear-gradient(180deg,#fff7c0 0%,#ffe060 34%,#e0a020 64%,#fff5b0 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:var(--tfx-edge); }

/* ソリッドゴールド（文字分割アニメ charRise/charPop 用＝background-clipを使わない） */
.tfx-gold-solid { color:#ffd84b; filter:var(--tfx-edge); }

/* 赤金グラデ（情熱系） */
.tfx-fire { background:linear-gradient(180deg,#fff2c0 0%,#ffb43c 38%,#ff5a2a 72%,#c81818 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:var(--tfx-edge); }

/* ネオン発光（暗背景向け） */
.tfx-neon { color:#fff; text-shadow:0 0 8px #ffe14a,0 0 18px #ffb000,0 0 34px #ff7a00,0 3px 6px rgba(0,0,0,.7); }
.tfx-neon-blue { color:#eaf6ff; text-shadow:0 0 8px #6cd6ff,0 0 18px #2aa8ff,0 0 34px #0a6cff,0 3px 6px rgba(0,0,0,.7); }

/* ポップ／レトロ（ハードな色影・ブラー0。縁は外向き） */
.tfx-pop { color:#fff; filter:var(--tfx-edge); text-shadow:7px 7px 0 #c80018; }

/* 3D 立体（多層オフセット影） */
.tfx-emboss { color:#ffd84b; text-shadow:0 1px 0 #b8860b,0 2px 0 #a5760a,0 3px 0 #8f6608,0 4px 0 #7a5607,0 6px 8px rgba(0,0,0,.7); filter:var(--tfx-edge-sm); }

/* マーカー蛍光（下半分ハイライト・行内spanに付与） */
.tfx-marker { background:linear-gradient(transparent 58%, rgba(255,221,51,.85) 58%); padding:0 .06em; }
.tfx-marker-red { background:linear-gradient(transparent 58%, rgba(255,60,80,.8) 58%); padding:0 .06em; }

/* 斜めストライプ塗り文字 */
.tfx-stripe { background:repeating-linear-gradient(45deg,#ffd84b 0 10px,#e0a020 10px 20px);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:var(--tfx-edge); }

/* --- “枠/帯”系コンテナ（テキストを包む要素に付与） --- */
/* 赤帯（上下ゴールドライン） */
.tfxc-band { display:inline-block; padding:.18em .9em; background:linear-gradient(180deg,#d4001c,#7a0010);
  border-top:4px solid #ffd54a; border-bottom:4px solid #ffd54a; box-shadow:0 10px 26px rgba(0,0,0,.55); }
/* 二重枠 */
.tfxc-double { display:inline-block; padding:.22em 1em; border:4px solid #ffd54a; position:relative; background:rgba(8,8,10,.55); }
.tfxc-double::before { content:""; position:absolute; inset:7px; border:2px solid rgba(255,213,74,.7); pointer-events:none; }
/* 左アクセントバー */
.tfxc-leftbar { display:inline-block; padding:.1em .5em .1em .85em; position:relative; }
.tfxc-leftbar::before { content:""; position:absolute; left:0; top:14%; bottom:14%; width:10px; border-radius:5px; background:linear-gradient(180deg,#ffd84b,#ff7a00); box-shadow:0 0 12px rgba(255,150,0,.6); }
/* リボン（折れ角） */
.tfxc-ribbon { display:inline-block; padding:.2em 1.3em; position:relative; background:linear-gradient(180deg,#d4001c,#9a0014); box-shadow:0 8px 20px rgba(0,0,0,.5); }
.tfxc-ribbon::before,.tfxc-ribbon::after { content:""; position:absolute; top:100%; border:12px solid transparent; }
.tfxc-ribbon::before { left:0; border-top-color:#6a000e; border-left-color:#6a000e; }
.tfxc-ribbon::after  { right:0; border-top-color:#6a000e; border-right-color:#6a000e; }
/* コーナーブラケット [ ] */
.tfxc-bracket { display:inline-block; padding:.16em 1.1em; position:relative; }
.tfxc-bracket::before,.tfxc-bracket::after { content:""; position:absolute; top:0; bottom:0; width:24px; border:5px solid #ffd54a; }
.tfxc-bracket::before { left:0; border-right:none; }
.tfxc-bracket::after  { right:0; border-left:none; }
/* スクリム（可読性パネル） */
.tfxc-scrim { padding:.4em 1em; border-radius:12px; background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.84) 0%, rgba(0,0,0,.6) 60%, rgba(0,0,0,0) 92%); }

/* ラベル小見出し（カードのsub用：ゴールド＋下線バー） */
.tfx-kicker { font-family:"JPHeavy"; color:#ffe89a; letter-spacing:.16em; position:relative; display:inline-block; padding-bottom:.4em;
  filter:var(--tfx-edge-sm); }
.tfx-kicker::after { content:""; position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:88px; height:4px; border-radius:2px; background:linear-gradient(90deg,#ffd84b,#ff7a00); box-shadow:0 0 10px rgba(255,150,0,.6); }

/* アンダースイープ用の下線要素 */
.tfx-uline { height:9px; width:0; margin:.18em auto 0; background:linear-gradient(90deg,transparent,#ffd84b 16%,#ff7a00 84%,transparent); }

エフ。2000年10月11日", "生まれの25歳。"]}, {"s": 75.25, "e": 81.68, "lines": ["キルギスの首都ビシュケクを拠点とし、生まれは", "タジキスタンとの国境に近い小さな村だ。"]}, {"s": 81.73, "e": 86.81, "lines": ["身長170センチ、リーチ174センチ。フェザー級。"]}, {"s": 86.86, "e": 95.44, "lines": ["戦績はプロ19戦19勝、無敗。KOが7、一本が12。", "判定はゼロ。全ての試合をフィニッシュで"]}, {"s": 95.44, "e": 97.14, "lines": ["終わらせている。"]}, {"s": 97.19, "e": 104.91, "lines": ["異名は、キルギスの犬鷲。空高くから獲物を", "仕留める猛禽になぞらえた、恐るべき二つ名だ。"]}, {"s": 104.96, "e": 108.89, "lines": ["その原点は、キルギスの大自然の中にあった。"]}, {"s": 111.34, "e": 119.81, "lines": ["彼の物語は、キルギスの実家から始まる。父と", "兄弟たちと暮らす家で、4人兄弟の三男一女の"]}, {"s": 119.81, "e": 121.25, "lines": ["家庭に育った。"]}, {"s": 121.3, "e": 128.61, "lines": ["父はこう証言している。ラジャブアリは幼い頃か", "ら活発で、馬やロバに乗り、あちこちで問題を"]}, {"s": 128.61, "e": 130.65, "lines": ["起こす勇敢な子だったと。"]}, {"s": 130.7, "e": 138.29, "lines": ["父を驚かせた、こんな逸話がある。幼い彼が、", "長い棒にたくさんの釘を打ち込んでいた。何を"]}, {"s": 138.29, "e": 141.72, "lines": ["しているのかと聞くと、彼はこう答えた。"]}, {"s": 141.77, "e": 146.39, "lines": ["夜にオオカミが家に来たら、追い払うための", "道具だ、と。"]}, {"s": 146.44, "e": 152.96, "lines": ["武道は誰かに勧められて始めたわけではない。", "本人は語っている。子供の頃から毎朝走り、"]}, {"s": 152.96, "e": 159.49, "lines": ["サンドバッグを叩いていた。世界レベルの", "武道家になりたくて、自分の意思でやってきたの"]}, {"s": 159.49, "e": 159.97, "lines": ["だと。"]}, {"s": 160.02, "e": 166.9, "lines": ["兄弟たちは日用品でトレーニング器具や", "サンドバッグを自作し、身体を鍛えた。武道は、"]}, {"s": 166.9, "e": 169.65, "lines": ["この一家の生き方そのものだった。"]}, {"s": 172.1, "e": 178.39, "lines": ["シェイドゥラエフの強さの土台は、レスリング、", "柔道、そしてブラジリアン柔術にある。"]}, {"s": 178.44, "e": 185.36, "lines": ["彼はコンバット柔術のアジア王者。自室には", "2019年からのメダルがずらりと並ぶ。"]}, {"s": 185.36, "e": 187.79, "lines": ["組み技こそが、彼の原点だ。"]}, {"s": 187.84, "e": 195.47, "lines": ["トレーニングは毎日、朝2時間、夜2時間。週末は", "必ずキルギスの山を走る。高地トレーニングで、"]}, {"s": 195.47, "e": 198.08, "lines": ["呼吸器と持久力を鍛えるためだ。"]}, {"s": 198.13, "e": 206.6, "lines": ["そして彼の異名、犬鷲。本人はこう語る。我々の", "祖先は鷲を使って狩りをした。鷲は猛禽の王。"]}, {"s": 206.6, "e": 211.52, "lines": ["その爪と嘴は武器であり、速く、そして容赦が", "ないと。"]}, {"s": 211.57, "e": 218.03, "lines": ["憧れの選手は、あの伝説エメリヤーエンコ・ヒョー", "ドル。プライドの時代から、その戦いを"]}, {"s": 218.03, "e": 218.97, "lines": ["見て育った。"]}, {"s": 219.02, "e": 223.64, "lines": ["組み技の申し子は、やがて世界の舞台へと", "羽ばたいていく。"]}, {"s": 226.09, "e": 231.22, "lines": ["2019年、シェイドゥラエフは地元キルギスで", "プロデビューを果たす。"]}, {"s": 231.27, "e": 237.04, "lines": ["Batyr Bashyをはじめとする現地の大会で、彼は", "無敗街道を突き進む。"]}, {"s": 237.09, "e": 243.23, "lines": ["三角絞め、膝十字、ヒールフック、", "リアネイキドチョーク。相手を選ばず、"]}, {"s": 243.23, "e": 247.37, "lines": ["あらゆる関節技と絞め技で一本を量産していった。"]}, {"s": 247.42, "e": 254.37, "lines": ["デビューからの試合、そのほとんどを1ラウンド、", "2ラウンドの一本勝ち。柔術の申し子の"]}, {"s": 254.37, "e": 255.75, "lines": ["面目躍如だった。"]}, {"s": 255.8, "e": 263.19, "lines": ["2020年8月には、地元キルギスの大会で", "フェザー級王座を獲得。国内の頂点に立った彼の"]}, {"s": 263.19, "e": 266.0, "lines": ["目は、すでに海の外を見ていた。"]}, {"s": 268.45, "e": 272.41, "lines": ["まず彼が乗り込んだのは、格闘技大国ロシアだ。"]}, {"s": 272.46, "e": 278.4, "lines": ["ここで注目したいのが、彼の階級だ。この", "海外挑戦の時期、シェイドゥラエフは"]}, {"s": 278.4, "e": 285.57, "lines": ["今より一階級軽いバンタム級で戦っていた。の", "ちのRIZINでのフェザー級よりも軽い体で、世界の"]}, {"s": 285.57, "e": 287.39, "lines": ["強豪に挑んでいたのだ。"]}, {"s": 287.44, "e": 294.78, "lines": ["参戦したのは、強豪の登竜門ACAヤングイーグルス。", "ここでも彼は、3試合すべてを打撃と絞めで"]}, {"s": 294.78, "e": 296.83, "lines": ["フィニッシュしてみせた。"]}, {"s": 296.88, "e": 303.79, "lines": ["中でも特筆すべきが、2022年の", "アスワド・アフマトフ戦。実はこの試合こそ、"]}, {"s": 303.79, "e": 308.33, "lines": ["19戦を通じて彼が唯一ダウンを喫した一戦だった。"]}, {"s": 308.38, "e": 314.76, "lines": ["だが、シェイドゥラエフは全く動じなかった。", "フラッシュダウンからすぐさま立て直すと、"]}, {"s": 314.76, "e": 321.31, "lines": ["アナコンダチョークで一本勝ち。ただ一度の", "ピンチすら、彼は瞬時にねじ伏せてみせたのだ。"]}, {"s": 321.36, "e": 329.36, "lines": ["2023年6月、舞台は韓国。Road FC 64で、地元の", "実力者ヤン・ジヨンと対戦する。試合が始まると"]}, {"s": 329.36, "e": 337.08, "lines": ["、シェイドゥラエフはここでも圧倒的だった。", "的確な打撃で相手を追い込み、一気に極めへと"]}, {"s": 337.08, "e": 337.82, "lines": ["向かう。"]}, {"s": 353.12, "e": 360.38, "lines": ["1ラウンド、リアネイキドチョークで一本勝ち。", "アウェーの韓国でも、彼の強さは揺るがなかった。"]}, {"s": 360.43, "e": 368.76, "lines": ["そして同じ年の10月、中東UAE。UAE Warriorsで、", "これもリアネイキドチョークで相手を仕留める。"]}, {"s": 368.81, "e": 376.65, "lines": ["キルギス、ロシア、韓国、UAE。世界を", "渡り歩いて積み上げた戦績は、実に12戦12勝、"]}, {"s": 376.65, "e": 383.88, "lines": ["全てフィニッシュ。この完璧な無敗記録に、", "ついに日本のRIZINが目をつけた。"]}, {"s": 386.33, "e": 394.24, "lines": ["2024年6月、RIZIN.47。シェイドゥラエフは、", "鳴り物入りで日本のリングに初登場する。"]}, {"s": 394.29, "e": 401.73, "lines": ["デビュー戦の相手は、武田光司。RIZINライト級の", "トーナメントで準優勝するなど、日本の最前線で"]}, {"s": 401.73, "e": 404.57, "lines": ["戦ってきたトップクラスの実力者だ。"]}, {"s": 404.62, "e": 410.96, "lines": ["しかも武田は、より重いライト級でも戦う体格の", "持ち主。少し前までバンタム級で"]}, {"s": 410.96, "e": 416.11, "lines": ["戦っていたシェイドゥラエフにとって、体格で", "上回る相手だった。"]}, {"s": 416.16, "e": 423.31, "lines": ["だが試合が始まると、その差は問題にならなか", "った。シェイドゥラエフは開始から的確に打撃を"]}, {"s": 423.31, "e": 428.3, "lines": ["当て、テイクダウンを奪い、日本の", "トップクラスを圧倒していく。"]}, {"s": 443.6, "e": 450.59, "lines": ["1ラウンド、リアネイキドチョーク。武田を一本で", "沈め、日本のファンにその名を刻みつけた。"]}, {"s": 450.59, "e": 452.4, "lines": ["衝撃のデビューだった。"]}, {"s": 452.45, "e": 460.69, "lines": ["続く2戦目、2024年9月のRIZIN48。相手は、", "フアン・アーチュレッタ。アメリカの強豪で、"]}, {"s": 460.69, "e": 464.35, "lines": ["元ベラトールのバンタム級世界王者だ。"]}, {"s": 464.4, "e": 471.32, "lines": ["世界王座を経験した実力者。だが、この男の前で", "も、シェイドゥラエフは危なげなかった。開始か"]}, {"s": 471.32, "e": 476.82, "lines": ["らプレッシャーをかけ、テイクダウンか", "らじわじわと相手を追い詰めていく。"]}, {"s": 492.12, "e": 498.03, "lines": ["1ラウンド、腕ひしぎ十字固め。", "世界王者経験者すらも、彼は一本で"]}, {"s": 498.03, "e": 499.57, "lines": ["仕留めてみせた。"]}, {"s": 502.02, "e": 508.54, "lines": ["2024年の大晦日、RIZIN49。3戦目の相手は、", "久保優太。"]}, {"s": 508.59, "e": 515.38, "lines": ["久保優太は、ケーワンの三階級を制した、", "元三冠王者。キックボクシングの世界で頂点を"]}, {"s": 515.38, "e": 521.66, "lines": ["極めた、屈指の打撃の名手だ。その", "鋭く重いキックとパンチは、ケーワンの舞台で"]}, {"s": 521.66, "e": 524.03, "lines": ["数々の強豪をなぎ倒してきた。"]}, {"s": 524.08, "e": 530.85, "lines": ["純粋なグラップラーであるシェイドゥラエフが、", "この打撃のスペシャリストに、どう挑むのか。"]}, {"s": 530.85, "e": 532.74, "lines": ["誰もが打撃戦を警戒した。"]}, {"s": 532.79, "e": 539.28, "lines": ["だが蓋を開けてみれば、打ち合いでも上回ったの", "は、シェイドゥラエフだった。得意の"]}, {"s": 539.28, "e": 543.44, "lines": ["テイクダウンも交え、打撃の名手を的確に", "捉えていく。"]}, {"s": 558.74, "e": 566.05, "lines": ["2ラウンド、TKO。打撃自慢の相手を前に、", "シェイドゥラエフは打ち合いでも上回ってみせた。"]}, {"s": 566.1, "e": 574.71, "lines": ["RIZIN参戦から、わずか3連勝。全て一本かTKOの", "フィニッシュ。彼はあっという間に、王座挑戦の"]}, {"s": 574.71, "e": 576.29, "lines": ["資格を手にする。"]}, {"s": 576.34, "e": 580.73, "lines": ["そして立ちはだかるのが、絶対王者クレベル・コイ", "ケだった。"]}, {"s": 583.18, "e": 591.88, "lines": ["2025年5月、RIZIN男祭り。相手は、柔術の鬼と", "呼ばれるフェザー級王者、クレベル・コイケ。"]}, {"s": 591.93, "e": 596.68, "lines": ["クレベルは、あの朝倉未来を、三角締めで一本に", "した男。"]}, {"s": 596.73, "e": 603.13, "lines": ["さらに、鈴木千裕にも判定で競り勝った、", "日本フェザー級最強の王者だ。誰もが、"]}, {"s": 603.13, "e": 606.41, "lines": ["シェイドゥラエフ最大の試練だと考えた。"]}, {"s": 621.71, "e": 628.85, "lines": ["だが、わずか1分2秒。右のフックがクレベルを", "打ち抜いた。柔術王者が、キャリアで"]}, {"s": 628.85, "e": 631.86, "lines": ["初めてKO負けを喫した瞬間だった。"]}, {"s": 631.9, "e": 639.57, "lines": ["第7代RIZINフェザー級王者、ラジャブアリ・シェイ", "ドゥラエフ誕生。彼は宣言する。このベルトを、"]}, {"s": 639.57, "e": 641.44, "lines": ["キルギスに持ち帰ると。"]}, {"s": 641.49, "e": 645.65, "lines": ["無敗のまま、彼はついに日本の頂点に立った。"]}, {"s": 648.1, "e": 652.71, "lines": ["王座を獲った男の快進撃は、防衛戦でさらに", "加速する。"]}, {"s": 652.76, "e": 661.3, "lines": ["2025年9月、名古屋でのRIZIN51。初防衛戦の", "相手は、ロシアのベテラン、ビクター・コレスニッ"]}, {"s": 661.3, "e": 661.7, "lines": ["ク。"]}, {"s": 680.0, "e": 686.1, "lines": ["開始わずか33秒でTKO。まばたきする間に、試合は", "終わっていた。"]}, {"s": 686.15, "e": 695.97, "lines": ["そして2025年の大晦日。2度目の防衛戦の相手は、", "日本で最も有名なMMAファイターの一人、朝倉未来。"]}, {"s": 696.02, "e": 703.31, "lines": ["プライドが終わり、日本の格闘技が冬の時代と", "言われ、人気が低迷していた頃。鋭い先見の明か"]}, {"s": 703.31, "e": 710.86, "lines": ["ら、いち早くユーチューブに目をつけて活動し、", "今や400万人を超える登録者を集め、格闘技人気に"]}, {"s": 710.86, "e": 714.42, "lines": ["再び火をつけた立役者。それが、朝倉未来だ。"]}, {"s": 714.47, "e": 721.7, "lines": ["経営者としても数多くの事業を手掛ける実業家で", "あり、UFCのコナーマクレガーを彷彿とさせる、"]}, {"s": 721.7, "e": 724.19, "lines": ["圧倒的なカリスマ性を持つ男だ。"]}, {"s": 724.24, "e": 731.73, "lines": ["彼が出場する大会は、ドームが満員になる。", "まさに、日本格闘技界最大のスターだ。しかも、"]}, {"s": 731.73, "e": 739.58, "lines": ["シェイドゥラエフ戦は、朝倉にとって、3度目の", "RIZINタイトルマッチ。悲願のベルトへ、日本中が"]}, {"s": 739.58, "e": 740.47, "lines": ["注目した。"]}, {"s": 740.52, "e": 746.29, "lines": ["そしてこの試合で、シェイドゥラエフの規格外の", "パワーが、改めて証明される。"]}, {"s": 746.34, "e": 752.98, "lines": ["腰が重く、テイクダウンを許さないことで", "知られる朝倉。その朝倉を、シェイドゥラエフは"]},   FX.slam(tl, kw.querySelector('.kwin'), 9.63, {from:1.4, blur:18, dur:.5}); FX.exit(tl, kw, 9.63+3.4, {});

  const stat = document.createElement('div'); stat.className='op-stat';
  stat.innerHTML="<div class='s1 tfx-kicker'>19戦19勝・無敗</div><div class='s2 tfx-mincho tfx-emboss'>判定<em>0</em></div>";
  openLayer.appendChild(stat);
  FX.fadeUp(tl, stat.querySelector('.s1'), 16.8, {y:16, dur:.4});
  tl.set(stat,{opacity:1}, 16.8);
  FX.slam(tl, stat.querySelector('.s2'), 16.8+0.15, {from:1.5, blur:20, dur:.5});
  FX.exit(tl, stat, 16.8+4.2, {});
  }

  const capLayer = document.getElementById('capLayer');
  (DATA.caps||[]).forEach((c) => {
    const el = document.createElement('div'); el.className='cap';
    el.innerHTML = c.lines.map((l)=>"<div class='cl'>"+l+"</div>").join('');
    capLayer.appendChild(el);
    tl.fromTo(el,{opacity:0,y:8},{opacity:1,y:0,duration:.14,ease:'power1.out'}, c.s);
    tl.to(el,{opacity:0,duration:.1,ease:'power1.in'}, c.e);
  });

  const chapLayer = document.getElementById('chapLayer');
  (DATA.chapters||[]).forEach((ch)=>{
    const el=document.createElement('div'); el.className='chap';
    el.innerHTML="<div class='cfull'></div><div class='cinner'><div class='csub2'>"+ch.sub+"</div><div class='ctitle'>"+ch.title+"</div><div class='cline'></div></div>";
    chapLayer.appendChild(el);
    const inner=el.querySelector('.cinner'), ttl=el.querySelector('.ctitle'), line=el.querySelector('.cline');
    if (ch.cont) {
      // 窓境界をまたぐ章タイトルは最初から完成状態（二重アニメ防止）
      tl.set(el,{opacity:1},0); tl.set(inner,{scale:1.0},0);
      tl.set(ttl,{letterSpacing:'0.04em',opacity:1},0); tl.set(line,{width:560},0);
    } else {
      tl.fromTo(el,{opacity:0},{opacity:1,duration:.2,ease:'power1.out'}, ch.start);
      tl.fromTo(inner,{scale:1.1},{scale:1.0,duration:.55,ease:'power3.out'}, ch.start);
      tl.fromTo(ttl,{letterSpacing:'0.2em',opacity:0},{letterSpacing:'0.04em',opacity:1,duration:.5,ease:'power2.out'}, ch.start+0.04);
      tl.fromTo(line,{width:0},{width:560,duration:.55,ease:'power2.out'}, ch.start+0.18);
    }
    if (!ch.cont_end) tl.to(el,{opacity:0,duration:.3,ease:'power1.in'}, ch.end-0.3);
  });

  window.__timelines = window.__timelines || {};
  window.__timelines['shaydullaev'] = tl;
</script>
</body>
