<!doctype html>

<html>
<head>
<meta charset="utf-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>/* ============================================================
   textfx.js — 動画用テキスト「アニメーション」登録ライブラリ（再利用）
   GSAP前提・seek安全（全て paused timeline tl に時刻 t で tween を積む）。
   使い方: TextFX.charRise(tl, el, t, {dur, stagger}); など。退場は TextFX.exit。
   HyperFramesルール順守: gsapのみ/同要素同プロパティ多重禁止/exitはオーバーレイのみ可。
   ============================================================ */
(function () {
  const g = () => window.gsap;

  // 文字を span.tfx-ch に分割（インラインブロック）。空白は保持。1回だけ実行。
  function splitChars(el) {
    if (el.__tfxSplit) return el.__tfxChars;
    const text = el.textContent;
    el.textContent = "";
    const chars = [];
    for (const ch of text) {
      const s = document.createElement("span");
      s.className = "tfx-ch";
      s.style.display = "inline-block";
      s.style.whiteSpace = "pre";
      s.textContent = ch;
      el.appendChild(s);
      if (ch !== " " && ch !== "　") chars.push(s);
    }
    el.__tfxSplit = true; el.__tfxChars = chars;
    return chars;
  }

  const TextFX = {
    // 文字が下からせり上がり（スタッガー）
    charRise(tl, el, t, o = {}) {
      const ch = splitChars(el); const tl2 = g();
      tl.fromTo(el, { opacity: 1 }, { opacity: 1, duration: 0.01 }, t);
      tl.fromTo(ch, { yPercent: 120, opacity: 0 },
        { yPercent: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "back.out(1.6)", stagger: o.stagger || 0.035 }, t);
    },
    // 文字がスケールでポップ
    charPop(tl, el, t, o = {}) {
      const ch = splitChars(el);
      tl.fromTo(ch, { scale: 0.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.45, ease: o.ease || "back.out(2)", stagger: o.stagger || 0.03 }, t);
    },
    // 左→右クリップワイプ表示
    wipe(tl, el, t, o = {}) {
      tl.fromTo(el, { clipPath: "inset(0 100% 0 0)", opacity: 1 },
        { clipPath: "inset(0 0% 0 0)", duration: o.dur || 0.8, ease: o.ease || "power4.out" }, t);
    },
    // 下からマスク表示（行が立ち上がる）
    riseMask(tl, el, t, o = {}) {
      tl.fromTo(el, { clipPath: "inset(110% 0 0 0)", yPercent: 18, opacity: 1 },
        { clipPath: "inset(0% 0 0 0)", yPercent: 0, duration: o.dur || 0.6, ease: o.ease || "power3.out" }, t);
    },
    // ふわっと上昇フェード
    fadeUp(tl, el, t, o = {}) {
      tl.fromTo(el, { y: o.y || 40, opacity: 0 },
        { y: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "power3.out" }, t);
    },
    // スケールポップ（要素全体）
    scalePop(tl, el, t, o = {}) {
      tl.fromTo(el, { scale: o.from || 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "back.out(1.7)" }, t);
    },
    // インパクトのあるスラム（大→等倍＋ブラー）
    slam(tl, el, t, o = {}) {
      tl.fromTo(el, { scale: o.from || 1.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: o.dur || 0.42, ease: o.ease || "power3.out" }, t);
      blurTween(tl, el, t, o.blur || 16, o.dur || 0.42);
    },
    // ブラーイン（焦点が合う）
    blurIn(tl, el, t, o = {}) {
      tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: (o.dur || 0.5) * 0.8, ease: "power1.out" }, t);
      blurTween(tl, el, t, o.blur || 18, o.dur || 0.5);
    },
    // ライトスピード（斜めスライドイン）
    lightspeed(tl, el, t, o = {}) {
      tl.fromTo(el, { x: o.x || 140, skewX: -22, opacity: 0 },
        { x: 0, skewX: 0, opacity: 1, duration: o.dur || 0.5, ease: o.ease || "power3.out" }, t);
    },
    // 下線スイープ（.tfx-uline 等の幅0→width）
    underline(tl, el, t, width, o = {}) {
      tl.fromTo(el, { width: 0 }, { width: width, duration: o.dur || 0.5, ease: o.ease || "power2.out" }, t);
    },
    // ゴールド等のグラデにシャイン走らせ（要素は background-size:230% 100% 想定）
    shine(tl, el, t, o = {}) {
      tl.fromTo(el, { backgroundPositionX: "120%" }, { backgroundPositionX: "-20%", duration: o.dur || 1.0, ease: "power1.inOut" }, t);
    },
    // オーバーレイ退場（カード等のみ可。シーン遷移には使わない）
    exit(tl, el, t, o = {}) {
      tl.to(el, { opacity: 0, y: o.y || -12, duration: o.dur || 0.35, ease: "power1.in" }, t);
    },
  };

  // filterブラーをオブジェクトproxyでtween（seek時もonUpdateで反映）。完了でinline filterを消し、CSSクラスのfilterを復帰。
  function blurTween(tl, el, t, from, dur) {
    const p = { b: from };
    tl.to(p, {
      b: 0, duration: dur, ease: "power2.out",
      onUpdate() { el.style.filter = "blur(" + p.b.toFixed(2) + "px)"; },
      onComplete() { el.style.filter = ""; },
      onReverseComplete() { el.style.filter = "blur(" + from + "px)"; },
    }, t);
  }

  window.TextFX = TextFX;
})();
</script>
<style>
/* ============================================================
   textfx.css — 動画用テキスト「デザイン」クラス集（再利用ライブラリ）

/* 【縁取りは“外向きのみ”＝drop-shadow積層】-webkit-text-stroke(中央寄せ=字を細らせる)は大型文字で使わない。

:root {

              drop-shadow(2.1px 2.1px 0 #0a0a0a) drop-shadow(-2.1px -2.1px 0 #0a0a0a) drop-shadow(2.1px -2.1px 0 #0a0a0a) drop-shadow(-2.1px 2.1px 0 #0a0a0a)

  --tfx-edge-sm: drop-shadow(1.6px 0 0 #0a0a0a) drop-shadow(-1.6px 0 0 #0a0a0a) drop-shadow(0 1.6px 0 #0a0a0a) drop-shadow(0 -1.6px 0 #0a0a0a)
              drop-shadow(0 2px 6px rgba(0,0,0,.85));
}

/* --- 文字そのもののデザイン（.tfx-* を文字要素に付与） --- */
.tfx-mincho { font-family:"Mincho",serif; font-weight:900; }
.tfx-heavy  { font-family:"JPHeavy","Noto Sans JP",sans-serif; font-weight:900; }

/* 外向きアウトライン（白） */
.tfx-outline { color:#fff; filter:var(--tfx-edge); }

/* ゴールドグラデ文字（縁は外向きdrop-shadow） */
.tfx-gold { background:linear-gradient(180deg,#fff7c0 0%,#ffe060 34%,#e0a020 64%,#fff5b0 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:var(--tfx-edge); }

/* ソリッドゴールド（文字分割アニメ charRise/charPop 用＝background-clipを使わない） */
.tfx-gold-solid { color:#ffd84b; filter:var(--tfx-edge); }

.tfx-fire { background:linear-gradient(180deg,#fff2c0 0%,#ffb43c 38%,#ff5a2a 72%,#c81818 100%);

.tfx-stripe { background:repeating-linear-gradient(45deg,#ffd84b 0 10px,#e0a020 10px 20px);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:var(--tfx-edge); }

/* --- “枠/帯”系コンテナ（テキストを包む要素に付与） --- */
/* 赤帯（上下ゴールドライン） */
.tfxc-band { display:inline-block; padding:.18em .9em; background:linear-gradient(180deg,#d4001c,#7a0010);
  border-top:4px solid #ffd54a; border-bottom:4px solid #ffd54a; box-shadow:0 10px 26px rgba(0,0,0,.55); }

.tfxc-double { display:inline-block; padding:.22em 1em; border:4px solid #ffd54a; position:relative; background:rgba(8,8,10,.55); }
.tfxc-double::before { content:""; position:absolute; inset:7px; border:2px solid rgba(255,213,74,.7); pointer-events:none; }
/* 左アクセントバー */
.tfxc-leftbar { display:inline-block; padding:.1em .5em .1em .85em; position:relative; }
.tfxc-leftbar::before { content:""; position:absolute; left:0; top:14%; bottom:14%; width:10px; border-radius:5px; background:linear-gradient(180deg,#ffd84b,#ff7a00); box-shadow:0 0 12px rgba(255,150,0,.6); }
/* リボン（折れ角） */
.tfxc-ribbon { display:inline-block; padding:.2em 1.3em; position:relative; background:linear-gradient(180deg,#d4001c,#9a0014); box-shadow:0 8px 20px rgba(0,0,0,.5); }
.tfxc-ribbon::before,.tfxc-ribbon::after { content:""; position:absolute; top:100%; border:12px solid transparent; }

/* コーナーブラケット [ ] */
.tfxc-bracket { display:inline-block; padding:.16em 1.1em; position:relative; }

.tfxc-bracket::before { left:0; border-right:none; }
.tfxc-bracket::after  { right:0; border-left:none; }
/* スクリム（可読性パネル） */
.tfxc-scrim { padding:.4em 1em; border-radius:12px; background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.84) 0%, rgba(0,0,0,.6) 60%, rgba(0,0,0,0) 92%); }

/* ラベル小見出し（カードのsub用：ゴールド＋下線バー） */
.tfx-kicker { font-family:"JPHeavy"; color:#ffe89a; letter-spacing:.16em; position:relative; display:inline-block; padding-bottom:.4em;
  filter:var(--tfx-edge-sm); }
.tfx-kicker::after { content:""; position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:88px; height:4px; border-radius:2px; background:linear-gradient(90deg,#ffd84b,#ff7a00); box-shadow:0 0 10px rgba(255,150,0,.6); }

/* アンダースイープ用の下線要素 */
.tfx-uline { height:9px; width:0; margin:.18em auto 0; background:linear-gradient(90deg,transparent,#ffd84b 16%,#ff7a00 84%,transparent); }

33.924, "end": 443.116, "text": "映像: Pexels"}], "caps": [{"s": 0.3, "e": 6.93, "lines": ["今回は、8月11日にトヨタアリーナ東京で", "開催される、RIZIN.54について、格闘家や"]}, {"s": 6.93, "e": 12.42, "lines": ["専門家がどんな勝敗予想をしているのかを、まと", "めてご紹介します。"]}, {"s": 12.47, "e": 19.59, "lines": ["注目のメインイベントは、元RIZINフェザー級王者ク", "レベル・コイケと、20歳の新星、秋元強真の"]}, {"s": 19.59, "e": 20.41, "lines": ["一戦です。"]}, {"s": 20.46, "e": 27.65, "lines": ["青木真也さんや川尻達也さんをはじめ、YouTubeで", "予想を語った15人の声を集計しました。"]}, {"s": 27.7, "e": 34.48, "lines": ["後半では、セミファイナルの佐藤将光対パッチー・", "ミックスや、平本丈対ジョリーなど、その他の"]}, {"s": 34.48, "e": 36.94, "lines": ["注目カードの予想も見ていきます。"]}, {"s": 36.99, "e": 39.61, "lines": ["それでは、さっそく見ていきましょう。"]}, {"s": 42.05, "e": 46.22, "lines": ["まずはメインイベント、クレベル・コイケ対秋元強", "真です。"]}, {"s": 46.27, "e": 53.95, "lines": ["クレベル・コイケは37歳。柔術を武器に、", "朝倉未来選手を一本で破るなど、数々の強豪を"]}, {"s": 53.95, "e": 57.69, "lines": ["下してきた、元RIZINフェザー級王者です。"]}, {"s": 57.74, "e": 65.27, "lines": ["対する秋元強真は、まだ20歳。現在5連勝中で、", "前戦ではあのパッチー・ミックスをKOしました。"]}, {"s": 65.27, "e": 69.77, "lines": ["今大会が、10試合目でのメインイベント抜擢と", "なります。"]}, {"s": 69.82, "e": 76.83, "lines": ["打撃と若さの秋元か、それとも寝技と経験の", "クレベルか。予想は大きく割れました。"]}, {"s": 76.88, "e": 84.95, "lines": ["集計の結果は、秋元が9人、クレベルが5人、", "五分が1人。まずは、秋元有利と見る声か"]}, {"s": 84.95, "e": 86.42, "lines": ["ら紹介します。"]}, {"s": 88.85, "e": 95.27, "lines": ["青木真也さんは、秋元の1ラウンド後半か", "ら2ラウンドでのKO勝ちを予想。クレベルが"]}, {"s": 95.27, "e": 101.85, "lines": ["組める距離にそもそも入れない、活路は一撃の", "関節技しかない、と圧倒を見込みます。"]}, {"s": 101.9, "e": 108.97, "lines": ["ストラッサー起一さんも、忖度なしで秋元。", "1ラウンドで組みを切って打撃、2ラウンドで"]}, {"s": 108.97, "e": 111.89, "lines": ["倒す、と2ラウンドKOを挙げました。"]}, {"s": 111.94, "e": 118.96, "lines": ["斎藤裕さんは、戦前の予想はやはり秋元有利の", "声が多い、と分析。ただし、ベストの"]}, {"s": 118.96, "e": 122.85, "lines": ["クレベルなら一本もある、と含みも残します。"]}, {"s": 122.9, "e": 130.21, "lines": ["川尻達也さんは、みんなが思うほど差は", "大きくない、若干秋元くらいだ、と僅差の秋元。"]}, {"s": 130.21, "e": 134.6, "lines": ["クレベルの数少ない勝ち筋は足関節だと", "指摘します。"]}, {"s": 134.65, "e": 141.51, "lines": ["ジョビンさんも秋元。ノリに乗っていて、体重も", "増やし、メンタル的にも充実している、と"]}, {"s": 141.51, "e": 142.68, "lines": ["評価しました。"]}, {"s": 142.73, "e": 149.49, "lines": ["女子スーパーアトム級王者の伊澤星花さんは、", "パッチー・ミックス戦と同じく触られないだろう、"]}, {"s": 149.49, "e": 152.11, "lines": ["秋元は速すぎる、と秋元を推します。"]}, {"s": 152.16, "e": 160.89, "lines": ["征矢貴さんも、秋元のKO勝ち。現在進行形で、", "どんどん強くなっている、と成長を高く買います。"]}, {"s": 160.94, "e": 168.12, "lines": ["火の鳥さんは、秋元がタックルを切ってボディを", "削り、左ストレートで1ラウンドKO、と具体的に"]}, {"s": 168.12, "e": 169.11, "lines": ["読みました。"]}, {"s": 169.16, "e": 175.57, "lines": ["そして金原正徳さんは、U-NEXTの公式予想番組で", "秋元の3ラウンドTKOを予想。クレベルが"]}, {"s": 175.57, "e": 181.67, "lines": ["触れられなければ、パッチー・ミックス戦の", "ように削られてしまう、と見ています。"]}, {"s": 184.1, "e": 187.26, "lines": ["一方で、クレベルを推したのが5人です。"]}, {"s": 187.31, "e": 194.47, "lines": ["扇久保博正さんは、クレベルがラストチャンスと", "死に物狂いで組みにいく、要所と離れ際の打撃で"]}, {"s": 194.47, "e": 197.89, "lines": ["意地を見せて判定勝ち、と接戦を予想します。"]}, {"s": 197.94, "e": 204.56, "lines": ["松嶋こよみさんは、クレベルの一本勝ち。秋元の", "打撃は速いけれど、踏み込んだところを"]}, {"s": 204.56, "e": 208.2, "lines": ["捕まえられて、下から三角絞め、と読みました。"]}, {"s": 208.25, "e": 214.04, "lines": ["そして、過去に秋元から勝利を", "挙げている元谷友貴さん。クレベルは決め力が"]}, {"s": 214.04, "e": 219.99, "lines": ["トップクラスで、尻上がりに調子を上げる、", "最後まで分からない選手。いい形を"]}, {"s": 219.99, "e": 224.13, "lines": ["作らせたら本当に危険だ、とクレベル寄りの", "見解です。"]}, {"s": 224.18, "e": 230.01, "lines": ["柔術家のホベルト・サトシ・ソウザさんは、", "1ラウンドは秋元の打撃が最も危険だけれど、"]}, {"s": 230.01, "e": 235.76, "lines": ["2ラウンドからはクレベルの投げと寝技に", "チャンスがある、とクレベルの2ラウンド一本を"]}, {"s": 235.76, "e": 236.62, "lines": ["予想します。"]}, {"s": 236.67, "e": 242.69, "lines": ["そして、クレベルに打撃を指導する鈴木博昭さんも", "、クレベルを支持しました。"]}, {"s": 245.12, "e": 251.55, "lines": ["五分と見たのは1人。太田忍さんは、どちらが", "勝ってもおかしくない、決着はフィニッシュに"]}, {"s": 251.55, "e": 254.03, "lines": ["なるだろう、と明言を避けました。"]}, {"s": 254.08, "e": 259.14, "lines": ["では、当の秋元強真本人は、どう語っているので", "しょうか。"]}, {"s": 259.19, "e": 266.03, "lines": ["本人は、練習で触られることがほとんどない、", "クレベルの崩し方は全部読めている、と自信を"]}, {"s": 266.03, "e": 270.75, "lines": ["見せます。あとは丁寧に頑張るだけ、と", "落ち着いた様子でした。"]}, {"s": 270.8, "e": 277.7, "lines": ["ファンの応援は秋元寄りが目立ちますが、予想は", "、秋元のKOと、クレベルの一本や判定で"]}, {"s": 277.7, "e": 284.43, "lines": ["真っ二つ。秋元を組める距離に入れさせないか、", "それが最大の分岐点になりそうです。"]}, {"s": 286.86, "e": 291.92, "lines": ["ここからは、その他の注目カードの予想を、まと", "めて見ていきましょう。"]}, {"s": 291.97, "e": 295.87, "lines": ["セミファイナルは、佐藤将光対パッチー・ミックス", "です。"]}, {"s": 295.92, "e": 301.17, "lines": ["青木真也さんはミックスがザバっと勝つと", "予想し、多くの予想者もミックス優勢と"]}, {"s": 301.17, "e": 306.28, "lines": ["見ています。ただし、全てはミックスの", "コンディションと計量次第、という声も"]}, {"s": 306.28, "e": 307.55, "lines": ["少なくありません。"]}, {"s": 307.7, "e": 313.9, "lines": ["平本丈対ジョリーは、1ラウンド勝負という見方が", "支配的です。1ラウンドでジョリーが"]}, {"s": 313.9, "e": 320.58, "lines": ["仕留めきれなければ、打たれ強い平本丈が打撃で", "優勢、と斎藤さんや石渡さんは平本を予想。"]}, {"s": 320.58, "e": 324.79, "lines": ["一方、秋元本人はジョリーの2ラウンド一本を", "推しました。"]}, {"s": 324.84, "e": 332.78, "lines": ["公式番組でも、伊澤星花さんは平本の判定、", "征矢貴さんは平本のKO、火の鳥さんはジョリーの"]}, {"s": 332.78, "e": 335.42, "lines": ["一本と、意見が割れています。"]}, {"s": 335.47, "e": 342.89, "lines": ["後藤丈治対アジズベク・テミロフは、真っ二つ。", "後藤の前蹴りや膝の距離感が生きれば判定、"]}, {"s": 342.89, "e": 347.13, "lines": ["テミロフの破壊力が爆発すればKO、という構図で", "す。"]}, {"s": 347.18, "e": 353.85, "lines": ["伊藤裕樹対アリベク・ガジャマトフは、伊藤が", "組みを切って打撃で圧倒できるかが鍵。"]}, {"s": 353.85, "e": 360.27, "lines": ["金原さんや斎藤さんは伊藤寄り、秋元本人は", "ガジャマトフのMMA力を評価しました。"]}, {"s": 360.32, "e": 366.9, "lines": ["組み技同士の対決、摩嶋一整対武田光司は、", "拮抗カード。短期決戦なら摩嶋、"]}, {"s": 366.9, "e": 372.35, "lines": ["長引けばレスリングとパワーの武田、と", "斎藤さんは分析します。"]}, {"s": 372.4, "e": 378.58, "lines": ["水野新太対リー・カイウェンは、ほぼ全員が", "水野を予想。細かく多彩な打撃と組みで、"]}, {"s": 378.58, "e": 383.82, "lines": ["カイウェンの大振りをポイントアウトする、と", "いう見立てが並びました。"]}, {"s": 383.87, "e": 391.36, "lines": ["上田幹雄対エドポロ・キングは、上田の蹴りと", "スピードが優勢という声が多数。おぎさんは、"]}, {"s": 391.36, "e": 395.11, "lines": ["上田の左上段回し蹴りでのKOを予想しました。"]}, {"s": 395.16, "e": 403.03, "lines": ["直樹対細川一颯は、総合力の直樹か、一発を", "持つ細川か。石渡さんは直樹の1ラウンド、"]}, {"s": 403.03, "e": 408.32, "lines": ["秋元本人は細川の1ラウンドKOと、こちらも", "割れています。"]}, {"s": 408.47, "e": 413.76, "lines": ["以上、RIZIN.54の勝敗予想を、まと", "めてお届けしました。"]}, {"s": 413.81, "e": 420.68, "lines": ["メインは秋元有利の声が優勢ながら、クレベルの", "逆転を推す実力者も、少なくありません。"]}, {"s": 420.73, "e": 426.14, "lines": ["皆さんは、どの試合の、どちらが勝つと", "思いますか。ぜひコメントで予想を"]}, {"s": 426.14, "e": 427.42, "lines": ["教えてください。"]}, {"s": 427.47, "e": 433.87, "lines": ["RIZIN.54は、8月11日、トヨタアリーナ東京で", "開催されます。"]}, {"s": 433.92, "e": 438.44, "lines": ["この動画が参考になったら、高評価と", "チャンネル登録をお願いします。"]}, {"s": 438.44, "e": 442.82, "lines": ["格闘ニュースラボでした。最後までご視聴ありが", "とうございました。"]}], "chapters": [{"sec": "s1_card", "start": 39.765, "end": 41.765, "title": "メインイベント", "sub": "クレベル・コイケ vs 秋元強真"}, {"sec": "s2_akimoto", "start": 86.572, "end": 88.572, "title": "秋元有利論", "sub": "8人が秋元を予想"}, {"sec": "s3_kleber", "start": 181.821, "end": 183.821, "title": "クレベル逆転論", "sub": "5人がクレベルを予想"}, {"sec": "s4_even", "start": 242.835, "end": 244.835, "title": "割れる予想", "sub": "五分、そして本人は"}, {"sec": "s5_semi", "start": 284.578, "end": 286.578, "title": "後半の注目カード", "sub": "セミファイナルほか"}], "channel": "格闘ニュースラボ"};

  DATA.tally.forEach((t) => {
    const el = document.createElement('div'); el.className='tally';
    el.innerHTML = "<div class='thead'>予想者15人の内訳</div><div class='trow'>"
      + "<div class='tcell ak'><div class='tlabel'>秋元</div><div class='tnum'>9<em>人</em></div></div>"
      + "<div class='tcell kl'><div class='tlabel'>クレベル</div><div class='tnum'>5<em>人</em></div></div>"
      + "<div class='tcell ev'><div class='tlabel'>五分</div><div class='tnum'>1<em>人</em></div></div></div>";
    tallyLayer.appendChild(el);
    const cells = el.querySelectorAll('.tcell');
    if (t.cont) { tl.set(el,{opacity:1},t.start); tl.set(cells,{opacity:1,y:0},t.start); }
    else {
      tl.fromTo(el,{opacity:0},{opacity:1,duration:.3}, t.start);
      tl.fromTo(cells,{opacity:0,y:26},{opacity:1,y:0,duration:.45,stagger:.12,ease:'back.out(1.3)'}, t.start+.1);
    }
    if (!t.cont_end) tl.to(el,{opacity:0,duration:.3,ease:'power1.in'}, t.end-.3);
  });

  const capLayer = document.getElementById('capLayer');
  (DATA.caps||[]).forEach((c) => {
    const el = document.createElement('div'); el.className='cap';
    el.innerHTML = c.lines.map((l)=>"<div class='cl'>"+l+"</div>").join('');
    capLayer.appendChild(el);
    if (c.cont) tl.set(el,{opacity:1,y:0},c.s);
    else tl.fromTo(el,{opacity:0,y:8},{opacity:1,y:0,duration:.14,ease:'power1.out'}, c.s);
    if (!c.cont_end) tl.to(el,{opacity:0,duration:.1,ease:'power1.in'}, c.e);
  });

  const chapLayer = document.getElementById('chapLayer');
  (DATA.chapters||[]).forEach((ch)=>{
    const el=document.createElement('div'); el.className='chap';
    el.innerHTML="<div class='cfull'></div><div class='cinner'><div class='csub2'>"+ch.sub+"</div><div class='ctitle'>"+ch.title+"</div><div class='cline'></div></div>";
    chapLayer.appendChild(el);
    const inner=el.querySelector('.cinner'), ttl=el.querySelector('.ctitle'), line=el.querySelector('.cline');
    if (ch.cont) { tl.set(el,{opacity:1},0); tl.set(inner,{scale:1.0},0); tl.set(ttl,{letterSpacing:'0.04em',opacity:1},0); tl.set(line,{width:560},0); }
    else {
      tl.fromTo(el,{opacity:0},{opacity:1,duration:.2,ease:'power1.out'}, ch.start);
      tl.fromTo(inner,{scale:1.1},{scale:1.0,duration:.55,ease:'power3.out'}, ch.start);
      tl.fromTo(ttl,{letterSpacing:'0.2em',opacity:0},{letterSpacing:'0.04em',opacity:1,duration:.5,ease:'power2.out'}, ch.start+0.04);
      tl.fromTo(line,{width:0},{width:560,duration:.55,ease:'power2.out'}, ch.start+0.18);
    }
    if (!ch.cont_end) tl.to(el,{opacity:0,duration:.3,ease:'power1.in'}, ch.end-0.3);
  });

  window.__timelines = window.__timelines || {};
  window.__timelines['rizin54-yosou'] = tl;
</script>
</body>
</html>
